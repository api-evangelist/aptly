aid: aptly
name: Aptly
description: >-
  Aptly is the AI operations layer for property management, built by Invisible Apps, Inc. It unifies
  resident and owner communication (calls, texts, emails, and chat) with board-based workflows,
  automation, and AI agents that handle leasing inquiries, maintenance requests, and around-the-clock
  resident communication, and it syncs bidirectionally with property management systems including
  Yardi, RealPage, Entrata, and AppFolio. The Aptly Core API (https://core-api.getaptly.com) gives
  external systems and AI agents direct read/write access to boards, cards, contacts, tasks, inboxes,
  calendars, files, and knowledge documents using a per-company API key, and Aptly ships an official
  hosted MCP server (https://mcp.getaptly.com/mcp) as the recommended way to connect LLMs. A separate
  Portal API powers the rental-application screening portal.
