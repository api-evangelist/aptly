  /api/contacts/conversations:
    post:
      description: Find real email, SMS, and call conversations by the contacts’
        stored email addresses and phone numbers, without a helpdesk ticket
        requirement. Includes open and closed threads by default, with no
        recent-date cutoff. Excludes junk/deleted streams and synthetic
        bulk-campaign activity. Newest message first, across accessible inboxes.
        API keys have company scope; delegate tokens need contacts:* read scope
        and follow current membership, inbox/team/monitor and contact-type sharing
        permissions (respecting channel opt-outs). Every contact must be active
        and in the authenticated company. Empty addresses return an empty page.
      tags: &a1
        - Contacts
      security: &a2
        - ApiKeyHeader: []
        - DelegateToken: []
      responses: &a3
        "200":
          description: A page of matching conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactConversationsResponse"
        "400":
          description: Invalid contact IDs, filters or pagination.
        "401":
          description: Invalid or missing credentials.
        "403":
          description: Missing scope, inactive user membership, guest user, or
            inaccessible inbox.
        "404":
          description: One or more contacts are missing, archived, deleted or outside the company.
      summary: Get conversations for contacts
      operationId: getConversationsForContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - personIds
              properties:
                personIds:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                status: &a4
                  type: string
                  enum:
                    - all
                    - open
                    - closed
                  default: all
                inboxId: &a5
                  type: string
                  description: Channel meta.id; narrows authorized inboxes, never expands access.
                search: &a6
                  type: string
                  maxLength: 200
                  description: Subject contains text; comma-separated literal alternatives.
                skip: &a7
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
                limit: &a8
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 20
            example:
              personIds:
                - contact-1
                - contact-2
              status: all
              skip: 0
              limit: 20
  /api/contacts/{contactId}/conversations:
    get:
      description: Find real email, SMS, and call conversations by the contacts’
        stored email addresses and phone numbers, without a helpdesk ticket
        requirement. Includes open and closed threads by default, with no
        recent-date cutoff. Excludes junk/deleted streams and synthetic
        bulk-campaign activity. Newest message first, across accessible inboxes.
        API keys have company scope; delegate tokens need contacts:* read scope
        and follow current membership, inbox/team/monitor and contact-type sharing
        permissions (respecting channel opt-outs). Every contact must be active
        and in the authenticated company. Empty addresses return an empty page.
      tags: *a1
      security: *a2
      responses: *a3
      summary: Get contact conversations
      operationId: getContactConversations
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: status
          in: query
          schema: *a4
        - name: inboxId
          in: query
          schema: *a5
        - name: search
          in: query
          schema: *a6
        - name: skip
          in: query
          schema: *a7
        - name: limit
          in: query
          schema: *a8

  /api/contacts:
    get:
      summary: List contacts
      description: |
        Returns a paginated list of contacts scoped to your company. All filter params are optional and ANDed together.
      operationId: listContacts
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based page index.
        - name: contact_type
          in: query
          schema:
            type: string
          description: Filter by contact type name.
        - name: email
          in: query
          schema:
            type: string
          description: Filter by exact email address (case-insensitive).
        - name: phone
          in: query
          schema:
            type: string
          description: Filter by phone number (digits only, partial match).
        - name: name
          in: query
          schema:
            type: string
          description: Filter by full name (case-insensitive, all words must match).
        - name: updated_after
          in: query
          schema:
            type: string
            format: date-time
          description: Return only contacts updated after this ISO 8601 timestamp.
        - name: updated_before
          in: query
          schema:
            type: string
            format: date-time
          description: Return only contacts updated before this ISO 8601 timestamp.
      responses:
        "200":
          description: Paginated contact list.
          headers:
            x-offset:
              schema:
                type: integer
              description: Current page index.
            x-count:
              schema:
                type: integer
              description: Total matching contacts.
            x-size:
              schema:
                type: integer
              description: Page size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Missing or invalid parameters.
        "401":
          description: Invalid or missing API key.

    post:
      summary: Create or update a contact
      description: |
        Creates a new contact or updates an existing one (upsert).

        **Lookup order:**
        1. If `_id` is provided, finds by ID.
        2. Otherwise finds by first email address.
        3. If no match is found, creates a new contact.

        **Body formats** — either native or legacy (capitalized keys) are accepted:

        *Native:* `firstname`, `lastname`, `email` (string or array), `phone` (array of `{number, type}`),
        `typeId`, `contactType`, `isCompany`, `title`, `company`, `imageUrl`, `customFields`

        *Legacy:* `"First Name"`, `"Last Name"`, `Email`, `"Mobile Phone"`, `"Work Phone"`,
        `"Home Phone"`, `"Contact Type"`, `Title`, `Company`

        Returns the enriched contact with custom fields populated by their type definitions.
      operationId: upsertContact
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Existing contact ID — when provided, updates that contact.
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: One or more email addresses.
                phone:
                  type: array
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                      type:
                        type: string
                        enum: [mobile, work, home]
                typeId:
                  type: string
                  description: Contact type ID.
                contactType:
                  type: string
                  description: Contact type name (alternative to `typeId` — resolved to an ID automatically).
                isCompany:
                  type: boolean
                title:
                  type: string
                company:
                  type: string
                imageUrl:
                  type: string
                  description: Absolute URL to a JPG or PNG photo.
                customFields:
                  type: object
                  description: Map of custom field ID to value. Unknown field IDs are rejected.
            example:
              firstname: "Jane"
              lastname: "Smith"
              email: "jane@example.com"
              phone:
                - number: "+15555550100"
                  type: "mobile"
              contactType: "Tenant"
      responses:
        "200":
          description: Contact created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid input (bad URL, unknown custom field, invalid date, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.

  /api/contacts/by-email:
    post:
      summary: Look up contacts by email
      description: |
        Returns contacts whose email address matches one or more of the provided values.
        Matching is case-insensitive and exact. Results are scoped to your company.
      operationId: getContactsByEmail
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: A single email address or an array of email addresses to look up.
                limit:
                  type: integer
                  default: 20
                  description: Maximum number of results to return.
                skip:
                  type: integer
                  default: 0
                  description: Number of results to skip (for pagination).
            example:
              email: "jane@example.com"
              limit: 20
              skip: 0
      responses:
        "200":
          description: Matching contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        "400":
          description: Missing or invalid email field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.

  /api/contacts/verify-email:
    post:
      summary: Initiate contact email verification
      description: |
        Looks up an email address against your org's contact database. If a match is found,
        generates a cryptographically strong 6-digit code, sends it to the address, and
        returns a `requestId` and `verifyUrl` to complete the verification.

        The code expires after 10 minutes and can only be used once.
      operationId: initiateContactVerification
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: The email address to verify.
                emailSubject:
                  type: string
                  description: Subject line for the verification email. Defaults to "Your verification code".
                replyTo:
                  type: string
                  description: Reply-To address for the verification email.
                emailHtml:
                  type: string
                  description: |
                    Custom HTML body for the verification email. Supports two placeholders:
                    `{{ verificationCode }}` — replaced with the 6-digit code.
                    `{{ expirationTime }}` — replaced with the expiry duration (e.g. "10 minutes").
            example:
              email: "jane@example.com"
              emailSubject: "Your access code"
              replyTo: "support@example.com"
              emailHtml: "<p>Your code is <strong>{{ verificationCode }}</strong>. It expires in {{ expirationTime }}.</p>"
      responses:
        "200":
          description: Verification initiated — code sent to the email address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    description: Opaque ID used to complete the verification.
                  verifyUrl:
                    type: string
                    description: API path to POST the code to (relative URL).
              example:
                requestId: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                verifyUrl: "/api/contacts/verify-email/a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4/confirm"
        "400":
          description: Missing or invalid email field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No contact found with that email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Verification request was created but the email could not be delivered (EMAIL_SEND_FAILURE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/contacts/verify-email/{requestId}/confirm:
    post:
      summary: Confirm contact email verification
      description: |
        Submits the 6-digit code received by email. Returns the matching contact records
        if the code is valid, not expired, and has not already been used.

        After 5 consecutive failed attempts the verification is permanently invalidated.
        The caller must re-initiate a new verification to try again.
      operationId: confirmContactVerification
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: The `requestId` returned by the initiate endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The 6-digit verification code sent to the email address.
            example:
              code: "042815"
      responses:
        "200":
          description: Code accepted — returns verified status and matching contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        "400":
          description: Missing code field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key, or code is invalid/expired/already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/contacts/{contactId}:
    get:
      summary: Get a contact
      description: Returns a single contact by its ID, with custom fields enriched by their type definitions.
      operationId: getContact
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact's `_id`.
      responses:
        "200":
          description: Contact record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
                  count:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "401":
          description: Invalid or missing API key.

    post:
      summary: Update a contact
      description: |
        Updates an existing contact by ID using the same upsert logic as `POST /api/contacts`.
        The `_id` is taken from the URL — any `_id` in the body is ignored.

        Accepts the same **native** or **legacy** body formats as `POST /api/contacts`.
        Returns the updated, enriched contact.
      operationId: updateContact
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact's `_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: One or more email addresses.
                phone:
                  type: array
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                      type:
                        type: string
                        enum: [mobile, work, home]
                typeId:
                  type: string
                  description: Contact type ID.
                contactType:
                  type: string
                  description: Contact type name (alternative to `typeId`).
                isCompany:
                  type: boolean
                title:
                  type: string
                company:
                  type: string
                imageUrl:
                  type: string
                  description: Absolute URL to a JPG or PNG photo.
                customFields:
                  type: object
                  description: Map of custom field ID to value.
            example:
              firstname: "Jane"
              lastname: "Smith"
              email: "jane@example.com"
      responses:
        "200":
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.

  /api/contacts/{contactId}/sentiment:
    get:
      summary: Get a contact's sentiment history
      description: |
        Returns the contact's conversation sentiment over the last 30 days, merged into a
        single series across every channel in the company and keyed off the addresses in the
        contact's `email` array.

        One point per day, oldest first. `score` is the average of the day's streams — each
        stream contributes one score, so a long conversation does not outweigh a short one —
        rounded to a whole number on a 0-100 scale. `overall` is the recency-weighted average
        across the window: today counts fully, a day at the edge of the window counts half.
        `totalStreams` counts the distinct conversations in the window, so a conversation
        spanning several days is counted once.

        A contact with no email addresses, or with no scored conversations in the window,
        returns `overall: null` and an empty `history`.
      operationId: getContactSentiment
      tags: [Contacts]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
          description: The contact's `_id`.
      responses:
        "200":
          description: Sentiment history for the contact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall:
                    type: integer
                    nullable: true
                    description: Recency-weighted average score (0-100) across the window.
                  totalStreams:
                    type: integer
                    description: Distinct conversations behind the window.
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date-time
                        score:
                          type: integer
                          description: Average score (0-100) for the day.
                        streams:
                          type: integer
                          description: Distinct conversations behind the day.
              example:
                overall: 76
                totalStreams: 2
                history:
                  - date: "2026-08-15T00:00:00.000Z"
                    score: 40
                    streams: 2
                  - date: "2026-09-04T00:00:00.000Z"
                    score: 100
                    streams: 1
        "401":
          description: Invalid or missing API key.
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/knowledge/create:
    post:
      summary: Create a knowledge document
      description: |
        Creates a new knowledge document scoped to your company. Optionally associates the
        document with a board (`aptletUuid`), a card (`aptletInstanceId`), or a parent
        document (`parentId`).

        HTML or Markdown content is accepted and stored internally as a structured document
        format. Provide either `html` or `markdown`, not both. Aptly custom blocks (cards,
        tasks, contacts, mentions, merge fields, form fields, embeds, diagrams) are written
        in `html` as described under "HTML format" in `PUT /api/knowledge/{id}`.
      operationId: createKnowledgeDoc
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              not:
                required: [html, markdown]
              properties:
                name:
                  type: string
                  description: Document title.
                html:
                  type: string
                  description: Initial HTML content for the document body. Mutually exclusive with `markdown`.
                markdown:
                  type: string
                  description: Initial Markdown content for the document body. Mutually exclusive with `html`.
                aptletUuid:
                  type: string
                  description: UUID of the board to associate this document with.
                aptletInstanceId:
                  type: string
                  description: Card ID to link this document to. Creates a reference on the card.
                parentId:
                  type: string
                  description: ID of a parent knowledge document (for nested pages).
                accessType:
                  type: string
                  enum: [public, private]
                  description: Access level. Defaults to `public`.
            example:
              name: "Lease Addendum Policy"
              html: "<p>This policy applies to all lease agreements...</p>"
              accessType: "private"
      responses:
        "201":
          description: Document created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: ID of the created document.
                  name:
                    type: string
        "400":
          description: Both `html` and `markdown` were provided (only one is allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Card or parent document not found (when `aptletInstanceId` or `parentId` provided).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/knowledge/list:
    get:
      summary: List knowledge documents
      description: |
        Lists knowledge documents scoped to your company — a folder's contents, or
        everything linked to a board, card, or conversation — in a lite shape (no rendered
        HTML), paginated.

        Access is scoped per-user when authenticated with a delegate token; API keys and
        partner tokens see every document in the company regardless of its private-doc
        shares.
      operationId: listKnowledgeDocs
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
          description: >
            Omit to list every document regardless of nesting. Pass "" or "null" to list
            root documents only, or a document ID to list that folder's contents.
        - name: aptletUuid
          in: query
          schema:
            type: string
          description: Only documents associated with this board.
        - name: aptletInstanceId
          in: query
          schema:
            type: string
          description: Only documents linked to this card.
        - name: streamId
          in: query
          schema:
            type: string
          description: Only documents extracted from this conversation.
        - name: search
          in: query
          schema:
            type: string
          description: >
            Case-insensitive substring match on document name. Regex metacharacters are
            escaped before being interpolated into the query, so the match is always
            literal.
        - name: archived
          in: query
          schema:
            type: boolean
          description: Set true to list archived documents instead of active ones.
        - name: ownerId
          in: query
          schema:
            type: string
          description: Only documents created by this user (matches `createdBy`).
        - name: updatedById
          in: query
          schema:
            type: string
          description: Only documents last updated by this user (matches `updatedBy`).
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Only documents created on or after this ISO date (inclusive).
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
          description: Only documents created on or before this ISO date (inclusive).
        - name: updatedFrom
          in: query
          schema:
            type: string
            format: date-time
          description: >
            Only documents last updated on or after this ISO date (inclusive). Filters
            `updatedAt` only, never `createdAt`.
        - name: updatedTo
          in: query
          schema:
            type: string
            format: date-time
          description: >
            Only documents last updated on or before this ISO date (inclusive). Filters
            `updatedAt` only, never `createdAt`.
        - name: unlinked
          in: query
          schema:
            type: boolean
          description: >
            Set true to list only documents with no `aptletUuid`, `aptletInstanceId`, or
            `streamId` — the knowledge base's own top-level documents ("pane 0"), as
            opposed to documents that hang off a board, card, or conversation. Cannot be
            combined with `aptletUuid`, `aptletInstanceId`, or `streamId`.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: >
            A non-numeric value is rejected with 400 rather than silently defaulting.
            A valid non-integer value (e.g. 10.5) is truncated.
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: >
            A non-numeric or negative value is rejected with 400 rather than silently
            coercing to 0. A valid non-integer value is truncated.
      responses:
        "200":
          description: Paginated list of knowledge document summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeDocSummary"
                  total:
                    type: integer
                  limit:
                    type: integer
                  skip:
                    type: integer
        "400":
          description: >
            Invalid input — an unparseable date, `to` not after `from`, `unlinked=true`
            combined with `aptletUuid`/`aptletInstanceId`/`streamId`, or a non-numeric
            `limit`/`skip` (or a negative `skip`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/knowledge/tree:
    get:
      summary: Get the knowledge document tree
      description: |
        Returns a lazy, depth-bounded tree of knowledge documents starting at `parentId`
        (root documents when omitted). Each node reports `hasChildren` so you can decide
        whether to fetch further levels via `GET /api/knowledge/{id}/children`.

        Accepts the same filter parameters as `GET /api/knowledge/list` (everything below
        except `limit`/`skip` — `parentId` here keeps its tree-specific meaning, the root
        to start from, not a filter). With no filter active, the response is the plain
        tree with no `matched` field on any node. With a filter active, the tree (already
        built and depth-bounded as usual) is pruned to documents that match the filter,
        plus their ancestors (so a match stays reachable from the root) and their
        descendants (so a matched folder's contents stay visible) — every kept node
        within the tree, matching or not, gets a `matched` boolean. A document that would
        only appear more than `depth` levels below the root is never fetched, so it can't
        match either — increase `depth` to search deeper.
      operationId: getKnowledgeTree
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
          description: Omit, or pass "" / "null", for the root level.
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
            maximum: 3
          description: How many levels to expand eagerly.
        - name: aptletUuid
          in: query
          schema:
            type: string
          description: Only match documents associated with this board.
        - name: aptletInstanceId
          in: query
          schema:
            type: string
          description: Only match documents linked to this card.
        - name: streamId
          in: query
          schema:
            type: string
          description: Only match documents extracted from this conversation.
        - name: search
          in: query
          schema:
            type: string
          description: >
            Case-insensitive substring match on document name. Regex metacharacters are
            escaped before being interpolated into the query, so the match is always
            literal.
        - name: archived
          in: query
          schema:
            type: boolean
          description: >
            Set true to match archived documents instead of active ones. Also widens tree
            traversal itself so archived documents (and their archived descendants) are
            reachable at all.
        - name: ownerId
          in: query
          schema:
            type: string
          description: Only match documents created by this user (matches `createdBy`).
        - name: updatedById
          in: query
          schema:
            type: string
          description: Only match documents last updated by this user (matches `updatedBy`).
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Only match documents created on or after this ISO date (inclusive).
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
          description: Only match documents created on or before this ISO date (inclusive).
        - name: updatedFrom
          in: query
          schema:
            type: string
            format: date-time
          description: >
            Only match documents last updated on or after this ISO date (inclusive).
            Filters `updatedAt` only, never `createdAt`.
        - name: updatedTo
          in: query
          schema:
            type: string
            format: date-time
          description: >
            Only match documents last updated on or before this ISO date (inclusive).
            Filters `updatedAt` only, never `createdAt`.
        - name: unlinked
          in: query
          schema:
            type: boolean
          description: >
            Set true to match only documents with no `aptletUuid`, `aptletInstanceId`, or
            `streamId` — the knowledge base's own top-level documents ("pane 0"). Cannot
            be combined with `aptletUuid`, `aptletInstanceId`, or `streamId`.
      responses:
        "200":
          description: Tree of knowledge document nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeTreeNode"
        "400":
          description: >
            Invalid input — an unparseable date, `to` not after `from`, or `unlinked=true`
            combined with `aptletUuid`/`aptletInstanceId`/`streamId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/knowledge/{id}/children:
    get:
      summary: List a knowledge document's direct children
      description: Returns the direct children of one knowledge document as a flat, lite-shape list.
      operationId: getKnowledgeDocChildren
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The knowledge document (folder) ID.
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
          description: >
            When true, include archived documents: the parent lookup no longer 404s on an
            archived parent, and archived children are included. Needed to expand a
            `hasChildren: true` archived folder returned by `GET /api/knowledge/tree`
            with `archived=true`.
      responses:
        "200":
          description: The document's direct children.
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeDocSummary"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/knowledge/{id}:
    get:
      summary: Get a knowledge document
      description: |
        Returns a knowledge document's full detail — folder path, shares, direct children,
        links to any board/card/conversation, view counts, and content rendered as HTML.

        `currentUser` is populated only when authenticated with a delegate token (its
        `userId` is known); it is `null` for API keys and partner tokens, which are
        company-wide credentials with no per-user permission check. A private document you
        cannot view returns 404, the same as one that doesn't exist. Unlike `list`/`tree`/
        `children`, this is a direct by-id fetch, so an archived document is still
        returned (with `archived: true`) rather than 404ing.
      operationId: getKnowledgeDoc
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The knowledge document ID.
      responses:
        "200":
          description: Knowledge document detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDoc"
              example:
                _id: "kdoc_abc123"
                name: "Lease Addendum Policy"
                emoji: null
                iconUrl: null
                coverUrl: null
                accessType: "public"
                isPrivate: false
                shares: []
                parentId: null
                path: []
                children: []
                childCount: 0
                links:
                  aptletUuid: null
                  aptletInstanceId: null
                  streamId: null
                published: false
                publishedAt: null
                views:
                  internal: 0
                  public: 0
                archived: false
                archivedAt: null
                createdAt: "2026-01-05T12:00:00.000Z"
                createdBy: "user_123"
                updatedAt: "2026-01-05T12:00:00.000Z"
                updatedBy: "user_123"
                currentUser: null
                html: "<p>This policy applies to all lease agreements...</p>"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a knowledge document
      description: |
        Updates a knowledge document's content and/or metadata. Only fields provided in the
        request body are updated — omitted fields are left unchanged. Provide either `html`
        or `markdown`, not both.

        ## HTML format

        Standard HTML (paragraphs, headings, lists, check lists, tables, quotes, code blocks,
        images, links, bold/italic/underline/strike) is converted to the editor's built-in
        blocks. Aptly's custom blocks and inline items are written as elements carrying a
        type attribute plus one `data-*` attribute per property. Property names are the
        camelCase names below written in kebab-case (`cardId` → `data-card-id`). Omitted
        properties take their default (empty string unless noted). Text inside a block
        element is ignored, except for the `ai` block. `GET /api/knowledge/{id}` returns
        these elements in the same format, so its `html` can be edited and sent back.

        **Blocks** — `<div data-content-type="TYPE" ...></div>`, placed between paragraphs:

        | Type | Properties | Example |
        | --- | --- | --- |
        | `card` | `cardId` | `<div data-content-type="card" data-card-id="CARD_ID"></div>` |
        | `task` | `taskId` | `<div data-content-type="task" data-task-id="TASK_ID"></div>` |
        | `contact` | `contactId` | `<div data-content-type="contact" data-contact-id="CONTACT_ID"></div>` |
        | `pageLink` | `documentId` (another knowledge document) | `<div data-content-type="pageLink" data-document-id="DOC_ID"></div>` |
        | `aptlyObject` | `objectId`, `objectType`, `aptletUuid` | `<div data-content-type="aptlyObject" data-object-id="ID" data-object-type="card" data-aptlet-uuid="BOARD_UUID"></div>` |
        | `embed` | `url`, `width` (number, default 500), `height` (number, default 400) | `<div data-content-type="embed" data-url="https://example.com" data-width="600" data-height="400"></div>` |
        | `mermaid` | `code` (Mermaid diagram source) | `<div data-content-type="mermaid" data-code="graph TD; A--&gt;B"></div>` |
        | `formField` | `boardUuid`, `fieldUuid`, `fieldType`, `label`, `required` (boolean, default false), `cardId`, `boardName`, `boardIcon`, `boardColor` | `<div data-content-type="formField" data-board-uuid="BOARD_UUID" data-field-uuid="FIELD_UUID" data-label="Move-in date" data-required="true"></div>` |
        | `mergeFieldBlock` | `key`, `boardUuid`, `fieldUuid`, `cardId`, `label`, `boardName` | `<div data-content-type="mergeFieldBlock" data-key="KEY" data-label="Unit"></div>` |
        | `ai` | `prompt`; the element's text is the generated content | `<div data-content-type="ai" data-prompt="Summarize the lease"><p>Generated text</p></div>` |

        **Inline items** — `<span data-inline-content-type="TYPE" ...></span>`, inside a
        paragraph, heading, list item or table cell:

        | Type | Properties | Example |
        | --- | --- | --- |
        | `userMention` | `id`, `entityId`, `fullName` (default `Unknown`), `type` (default `user`), `mentionedBy` | `<span data-inline-content-type="userMention" data-id="USER_ID" data-full-name="Jane Doe"></span>` |
        | `cardMention` | `cardId` | `<span data-inline-content-type="cardMention" data-card-id="CARD_ID"></span>` |
        | `taskMention` | `taskId` | `<span data-inline-content-type="taskMention" data-task-id="TASK_ID"></span>` |
        | `mergeField` | `key`, `boardUuid`, `fieldUuid`, `cardId`, `label`, `boardName`, `fallback` (omit for no fallback) | `<span data-inline-content-type="mergeField" data-key="KEY" data-label="Rent"></span>` |

        Notes:
        - Escape attribute values as HTML (`&quot;`, `&amp;`, `&lt;`, `&gt;`).
        - `true`/`false` and numbers in attributes are read as booleans and numbers.
        - An element without its `data-content-type` / `data-inline-content-type`
          attribute is treated as plain HTML, not as the custom item.
        - The `ai` block keeps only the text of its first `<p>`.
        - Multi-column layouts are not supported.
        - Markdown cannot express custom blocks; use `html` for them.
      operationId: updateKnowledgeDoc
      tags: [Knowledge]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The knowledge document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              not:
                required: [html, markdown]
              properties:
                name:
                  type: string
                  description: New document title.
                html:
                  type: string
                  description: Replacement HTML content for the document body. Mutually exclusive with `markdown`.
                markdown:
                  type: string
                  description: Replacement Markdown content for the document body. Mutually exclusive with `html`.
                accessType:
                  type: string
                  enum: [public, private]
                  description: New access level.
            example:
              name: "Updated Lease Addendum Policy"
              html: "<p>Revised policy effective March 2026...</p>"
      responses:
        "200":
          description: Document updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
        "400":
          description: Both `html` and `markdown` were provided (only one is allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/email/create-draft:
    post:
      summary: Create an email draft
      description: |
        Creates a new outbound email discussion (stream) with a single draft entry, scoped to
        your company. Returns the `streamId` and `draftUuid` needed to send via
        `POST /api/email/send`.

        Recipient fields (`to`, `cc`, `bcc`) accept an array of `{ value, label? }` objects
        where `value` is the email address.

        ### Adding attachments

        Attachments must be uploaded to storage **before** you reference them here — you
        cannot post file bytes to this endpoint. Upload each file with the three-step direct
        upload flow, then attach it:

        1. **Get an upload URL** — `POST /api/files/upload-url` with `attachEntityType: "channel"`,
           `attachEntityId` set to the same `channelId` you're emailing from, and the file's
           `name`, `extension`, `size`, and `contentType`. It returns `{ fileId, url, fields }`.
        2. **Upload to S3** — send a `multipart/form-data` `POST` to `url`, appending every
           entry from `fields` first and the file bytes last as a `file` field. S3 returns `204`.
        3. **Mark complete** — `POST /api/files/upload-complete` with the `fileId` from step 1.

        Then, on this request:
        - **Regular attachment** — add the `fileId`(s) to `attachmentIds`.
        - **Inline image** — embed an `<img>` in the HTML `body` whose `src` is the file's
          download URL (`.../cdn/storage/AptlyFiles/<fileId>/original/...`, returned by step 3).
          It is auto-detected and registered; do **not** also list it in `attachmentIds`.

        Repeat steps 1–3 per file. Each `fileId` must reference a finished upload or the
        request is rejected.
      operationId: createEmailDraft
      tags: [Email]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, channelId]
              properties:
                userId:
                  type: string
                  description: User to record as the draft creator/sender.
                channelId:
                  type: string
                  description: "`channel.meta.id` of the outbound email channel."
                companyId:
                  type: string
                  description: Company ID. Required only when authenticating with a partner token; resolved automatically for API key and delegate token auth.
                discussionId:
                  type: string
                  description: |
                    When set, append the draft as a reply to this existing thread (stream
                    ID) instead of starting a new discussion. The thread must belong to the
                    same company and channel. The thread's subject is kept and the draft is
                    threaded onto the thread's last message.
                to:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                cc:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                bcc:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                subject:
                  type: string
                body:
                  type: string
                  description: |
                    Email body (plain text or HTML). To embed an uploaded image inline, add
                    an `<img>` whose `src` is the file's download URL from
                    `POST /api/files/upload-complete`
                    (`.../cdn/storage/AptlyFiles/<fileId>/original/...`). Inline images are
                    auto-detected, tagged with `data-inline-image-id`, and registered on the
                    draft — do not also list them in `attachmentIds`.
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: |
                    File ids to include as regular attachments. Upload each file first
                    (`POST /api/files/upload-url` with attachEntityType `channel` and the same
                    channelId → upload to S3 → `POST /api/files/upload-complete`), then pass the
                    resulting `fileId`s here. Each must reference a finished upload.
                aptletInstanceId:
                  type: string
                  description: |
                    Card to link the outbound to. When set, sending the draft logs the
                    email as an activity on the card and tags the discussion with it.
            example:
              userId: "user_abc"
              channelId: "channel_abc"
              to:
                - value: "tenant@example.com"
                  label: "Jane Tenant"
              subject: "Your lease renewal"
              body: "Please review the attached renewal terms."
              aptletInstanceId: "card_abc"
      responses:
        "200":
          description: Draft stream created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  streamId:
                    type: string
                    description: Discussion/stream ID to pass to `POST /api/email/send`.
                  draftUuid:
                    type: string
                    description: Draft UUID to pass to `POST /api/email/send`.
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/email/send:
    post:
      summary: Send an email
      description: |
        Sends an outbound email scoped to your company. Two usage patterns:

        `userId` and `channelId` are required on every call.

        **From an existing draft** — also provide `discussionId` and `uuid` returned by
        `POST /api/email/create-draft`. The draft's stored recipients, subject, and body are
        used.

        **On-the-fly** — omit `uuid` and provide `userId`, `channelId`, recipients, subject,
        and body. A draft is created automatically before sending. Supplying `discussionId`
        (without `uuid`) sends the message as a reply into that existing thread — the
        thread's subject is kept; omitting both `discussionId` and `uuid` starts a new thread.

        ### Adding attachments

        Attachments apply to the **on-the-fly** pattern (for an existing draft, attach files
        when you call `POST /api/email/create-draft`). Upload each file with the three-step
        direct upload flow first — you cannot post file bytes to this endpoint:

        1. **Get an upload URL** — `POST /api/files/upload-url` with `attachEntityType: "channel"`,
           `attachEntityId` set to the same `channelId` you're sending from, and the file's
           `name`, `extension`, `size`, and `contentType`. Returns `{ fileId, url, fields }`.
        2. **Upload to S3** — `multipart/form-data` `POST` to `url`, all `fields` first then the
           file bytes last as a `file` field. S3 returns `204`.
        3. **Mark complete** — `POST /api/files/upload-complete` with the `fileId`.

        Then, on this request:
        - **Regular attachment** — add the `fileId`(s) to `attachmentIds`.
        - **Inline image** — embed an `<img>` in the HTML `body` whose `src` is the file's
          download URL (`.../cdn/storage/AptlyFiles/<fileId>/original/...`). Auto-detected and
          registered; do **not** also list it in `attachmentIds`.

        Each `fileId` must reference a finished upload.
      operationId: sendEmail
      tags: [Email]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, channelId]
              properties:
                discussionId:
                  type: string
                  description: |
                    Stream ID from `POST /api/email/create-draft` (required if `uuid` is set).
                    When supplied without `uuid`, the on-the-fly draft is appended as a reply
                    into this existing thread (same company + channel) instead of starting a
                    new discussion; the thread's subject is kept.
                uuid:
                  type: string
                  description: Draft UUID from `POST /api/email/create-draft`. Required if `discussionId` is set.
                failOnCreateNewThread:
                  type: boolean
                  default: true
                  description: |
                    If `true` (default), the send fails when the email would create a new
                    discussion thread rather than reply to an existing one.
                userId:
                  type: string
                  description: Required when sending on-the-fly (no `discussionId`/`uuid`).
                channelId:
                  type: string
                  description: Required when sending on-the-fly.
                companyId:
                  type: string
                  description: Company ID. Required only when authenticating with a partner token; resolved automatically for API key and delegate token auth.
                to:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                cc:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                bcc:
                  type: array
                  items:
                    $ref: "#/components/schemas/EmailRecipient"
                subject:
                  type: string
                body:
                  type: string
                  description: |
                    Email body (plain text or HTML). To embed an uploaded image inline, add
                    an `<img>` whose `src` is the file's download URL from
                    `POST /api/files/upload-complete`
                    (`.../cdn/storage/AptlyFiles/<fileId>/original/...`). Inline images are
                    auto-detected, tagged with `data-inline-image-id`, and registered on the
                    draft — do not also list them in `attachmentIds`. Applies when the draft
                    is created on-the-fly (no `discussionId`/`uuid`).
                attachmentIds:
                  type: array
                  items:
                    type: string
                  description: |
                    File ids to include as regular attachments (applies when the draft is
                    created on-the-fly). Upload each file first (`POST /api/files/upload-url`
                    with attachEntityType `channel` and the same channelId → upload to S3 →
                    `POST /api/files/upload-complete`), then pass the resulting `fileId`s here.
                    Each must reference a finished upload.
                aptletInstanceId:
                  type: string
                  description: |
                    Card to link the outbound to. Logs the email as an activity on the
                    card and tags the discussion. Works whether the draft was pre-created
                    or is created on-the-fly.
            examples:
              from_draft:
                summary: Send from an existing draft
                value:
                  userId: "user_abc"
                  channelId: "channel_abc"
                  discussionId: "stream_abc"
                  uuid: "draft_xyz"
              on_the_fly:
                summary: On-the-fly send
                value:
                  userId: "user_abc"
                  channelId: "channel_abc"
                  to:
                    - value: "tenant@example.com"
                  subject: "Your lease renewal"
                  body: "Please review the attached renewal terms."
                  aptletInstanceId: "card_abc"
      responses:
        "200":
          description: Email sent successfully.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request body failed validation, for example a recipient that is not an email address, or a missing `userId` or `channelId`. See `meta.issues` for each field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/app/verify:
    post:
      summary: Verify a delegate token (keyless)
      description: |
        Validates a short-lived delegate token without requiring an API key. The token must
        include an `appClientId` (i.e. it was issued for an embedded app via
        `POST /api/platform/user-token`). Returns the user's identity, company name, and
        the app's title.
      operationId: verifyDelegateToken
      tags: [App]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Delegate token returned by `POST /api/platform/user-token`.
      responses:
        "200":
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                    nullable: true
                  firstName:
                    type: string
                    nullable: true
                  lastName:
                    type: string
                    nullable: true
                  companyId:
                    type: string
                  companyName:
                    type: string
                    nullable: true
                  appClientId:
                    type: string
                  appTitle:
                    type: string
                    nullable: true
        "400":
          description: token field is missing.
        "401":
          description: Token is invalid, expired, or was not issued for an embedded app (missing appClientId).

  /api/app/me:
    get:
      summary: Get credential info
      description: |
        Returns identity information for the credential used in the request. The response shape
        depends on the auth method:

        - **Delegate token** (`Authorization: DelegateToken <token>`): returns user identity and,
          if the token has an `appClientId`, embedded-app context.
        - **API key** (`x-token` header or query param): returns company identity.
        - **Partner token** (`Authorization: Bearer <token>`): returns the partner's permission list.
      operationId: getMe
      tags: [App]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      responses:
        "200":
          description: Credential identity.
          content:
            application/json:
              schema:
                oneOf:
                  - title: Delegate token — user
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [user]
                      userId:
                        type: string
                      email:
                        type: string
                        nullable: true
                      firstName:
                        type: string
                        nullable: true
                      lastName:
                        type: string
                        nullable: true
                      companyId:
                        type: string
                      companyName:
                        type: string
                        nullable: true
                  - title: Delegate token — app
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [app]
                      userId:
                        type: string
                      email:
                        type: string
                        nullable: true
                      firstName:
                        type: string
                        nullable: true
                      lastName:
                        type: string
                        nullable: true
                      companyId:
                        type: string
                      companyName:
                        type: string
                        nullable: true
                      appClientId:
                        type: string
                      appTitle:
                        type: string
                        nullable: true
                  - title: API key
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [apiKey]
                      companyId:
                        type: string
                      companyName:
                        type: string
                        nullable: true
                  - title: Partner token
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [partner]
                      permissions:
                        type: array
                        items:
                          type: string
        "401":
          description: Invalid or missing credential.

  /api/board/{boardId}/webhook:
    post:
      summary: Set or update the board's webhook
      description: |
        Sets the board's webhook URL. Calling this again re-points an existing webhook (an
        update) rather than creating a second one — a board has at most one webhook.

        A new `webhookSigningKey` is generated every time this is called, including on
        update, so re-pointing a webhook also rotates its signing key.
      operationId: setBoardWebhook
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhookUrl]
              properties:
                webhookUrl:
                  type: string
                  description: Must be a valid http or https URL.
      responses:
        "201":
          description: Webhook set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      webhookUrl:
                        type: string
                      webhookSigningKey:
                        type: string
                        description: Shared secret used to sign the webhook payload.
        "400":
          description: Missing or invalid `webhookUrl`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board, or the key lacks insert/update permission.
        "404":
          description: Board not found.
    delete:
      summary: Remove the board's webhook
      description: |
        Removes the board's webhook, if one is set. Idempotent — calling this when no
        webhook is configured still returns 200.
      operationId: deleteBoardWebhook
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook removed (or already absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      webhookUrl:
                        type: string
                        nullable: true
                        example: null
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board, or the key lacks update permission.
        "404":
          description: Board not found.

  /api/board/{boardId}/configuration:
    get:
      summary: Get full board configuration
      description: |
        Returns all configuration sections for the board in a single response:
        fields, automations, options, tabViews, workflows, groups, shares, theme, and filters.
      operationId: getBoardConfiguration
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      responses:
        "200":
          description: Full board configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fields:
                        type: array
                        items:
                          $ref: "#/components/schemas/BoardField"
                      automations:
                        type: array
                        description: The older create-card rules (same data as `GET .../configuration/card-rules`). Despite the name these are not Automations - those are in `workflows` below, kept under this key for backwards compatibility.
                        items:
                          $ref: "#/components/schemas/CardRule"
                      options:
                        $ref: "#/components/schemas/BoardOptions"
                      tabViews:
                        type: array
                        items:
                          $ref: "#/components/schemas/TabView"
                      workflows:
                        type: array
                        description: The board's Automations (same data as `GET .../configuration/automations`). Called workflows here for backwards compatibility.
                        items:
                          type: object
                      groups:
                        type: array
                        description: Field groups (sections) configured on the board.
                        items:
                          type: object
                      shares:
                        type: object
                        description: Board access settings.
                        properties:
                          accessType:
                            type: string
                            enum: [public, private]
                          acl:
                            type: array
                            items:
                              type: object
                      theme:
                        type: object
                        description: Board identity fields.
                        properties:
                          name:
                            type: string
                          cardName:
                            type: string
                          color:
                            type: string
                            description: Hex color for the board gradient.
                          icon:
                            type: string
                          description:
                            type: string
                          shortCode:
                            type: string
                      filters:
                        type: array
                        description: Saved filters visible to the caller.
                        items:
                          type: object
        "401":
          description: Invalid or missing API key.
        "404":
          description: Board not found.


  /api/board/{boardId}/configuration/automations:
    post:
      summary: Create an automation
      description: |
        Creates an Automation on the board (the board's `workflows`). Requires `update` permission and
        the key's "Automations" access (a separate toggle on the key, off by default, independent of
        "Edit Boards"); a key's board allowlist applies.

        **Always created paused.** Nothing runs until the automation is switched on in the Aptly app,
        so the API can't set one live. Existing cards are not enrolled: once it is switched on a stage
        automation applies to cards that enter the stage afterwards.

        **Validated strictly - the request is refused outright on the first problem.** Unknown
        properties, a stage / field / template / inbox / contact type / user / team that doesn't exist
        (or is archived) on this board or organization, an email template used for an SMS (or the
        reverse), an inbox of the wrong type or with no users, conditions that are empty, on a missing
        field, with an unsupported operator or a bad value, a delay with business hours, or a task or
        due-date action with business days, when none are configured, a webhook to anything but a public https address, and a pair of stage-moving
        automations that would send cards round in a circle are all rejected with `400`. Shape problems
        come back as `VALIDATION_ERROR` with the offending path in `meta.issues`; problems found by
        checking against your data come back as `INVALID_DATA` with a message that names the path
        (for example `actions[1].templateId: template "abc" was not found`).

        Supported triggers: `stage`, `segment` (conditions), `reply`. Supported actions: `email`, `sms`,
        `task`, `assign`, `update_fields`, `stage`, `due_date`, `notify`, `archive`, `archive_convos`,
        `webhook`. Task-completion and field-group triggers and the Yardi, e-sign, PDF, team-access and
        related-card actions aren't available through the API.

        The response is the stored automation (the same shape `GET .../automations` returns).
      operationId: createAutomation
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRequest"
            examples:
              emailAfterStage:
                summary: Email the contact two days after a stage change
                value:
                  title: Tour follow-up
                  trigger: { type: stage, stage: Tour Scheduled }
                  timing: { mode: after, amount: 2, unit: days, timeOfDay: 9 }
                  actions:
                    - type: email
                      inbox: assignee
                      templateId: 5kQx2mP9
                      to: { type: relatedContacts }
              staleLeads:
                summary: Nudge stale leads on Mondays and Wednesdays
                value:
                  title: Nudge stale leads
                  trigger:
                    type: segment
                    conditions:
                      - { fieldUuid: stage, operator: anyIn, value: [New Lead, Contacted] }
                  timing: { mode: daysOfWeek, days: [1, 3], timeOfDay: 8 }
                  actions:
                    - type: update_fields
                      fields:
                        - { fieldUuid: status, value: Needs Follow Up }
                    - type: notify
                      teamIds: [7Hq3dZ]
                      message: Stale lead
      responses:
        "201":
          description: The created automation (paused).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: 'The stored automation. `archived: true` means paused.'
                    properties:
                      uuid: { type: string }
                      title: { type: string }
                      archived: { type: boolean, example: true }
                      triggerOn: { type: string }
                      timingMode: { type: string }
                      description: { type: string }
                      actions: { type: array, items: { type: object } }
        "400":
          description: "`VALIDATION_ERROR` (shape) or `INVALID_DATA` (a reference or rule that doesn't hold)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
        "403":
          description: The key lacks `update` permission or the "Automations" access, or the board isn't API-enabled.
        "404":
          description: Board not found.
    get:
      summary: List board automations
      description: |
        Returns the automations configured on a board (the board's `workflows` in the data model).
        The older create-card rules that move or copy cards are listed at `.../configuration/card-rules`.
      operationId: listAutomations
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      responses:
        "200":
          description: Array of automations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "401":
          description: Invalid or missing API key.
        "404":
          description: Board not found.


  /api/board/{boardId}/configuration/card-rules:
    get:
      summary: List create-card rules
      description: Returns the older create-card rules on a board (`board` and `schedule` rules that move or copy cards). These are not Automations - see `.../configuration/automations`.
      operationId: listCardRules
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      responses:
        "200":
          description: Array of create-card rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CardRule"
        "401":
          description: Invalid or missing API key.
        "404":
          description: Board not found.


  /api/board/{boardId}/configuration/options:
    get:
      summary: Get board options
      description: Returns the current configuration options for the board.
      operationId: getBoardOptions
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BoardOptions"
        "401":
          description: Invalid or missing API key.
        "404":
          description: Board not found.


  /api/board/{boardId}/configuration/fields:
    get:
      summary: List board fields
      description: Returns all fields defined on the board, including archived ones.
      operationId: listBoardFields
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of board fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardField"
        "401":
          description: Invalid or missing API key.
        "404":
          description: Board not found.
    post:
      summary: Add a field
      description: |
        Adds a custom field to the board. Requires `update` permission and the key's "Edit Boards"
        access (off by default; not needed on a board that same key created); a key's board allowlist
        still applies, except for a board that key created. Accepts the same field shape
        and allowed field types as `POST /api/boards` (relational and system types are rejected;
        use `POST /api/board/{boardId}/configuration/mirror-fields` for a mirror field);
        `uuid` must not be reserved or already used on the board.
      operationId: addBoardField
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  $ref: "#/components/schemas/NewBoardFieldType"
                uuid:
                  type: string
                  description: Optional key; must match `^[a-zA-Z][a-zA-Z0-9_]{0,63}$`. Generated when omitted.
                optional:
                  type: boolean
                pinned:
                  type: boolean
                defaultValue:
                  type: string
                data:
                  type: array
                  description: Required (non-empty) for `singleselect` and `multiselect`.
                  items:
                    type: object
                    required: [label]
                    properties:
                      label:
                        type: string
                      uuid:
                        type: string
            example:
              name: "Priority"
              type: "singleselect"
              data:
                - label: "Low"
                - label: "High"
      responses:
        "201":
          description: The created field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BoardField"
        "400":
          description: "`VALIDATION_ERROR` (per-field `meta.issues`) or a rule violation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
        "403":
          description: >-
            The key lacks `update` permission or the "Edit Boards" access, the board isn't API-enabled,
            or the field can't be changed (locked, standard, mirror or integration-managed).
        "404":
          description: Board (or field) not found.


  /api/board/{boardId}/configuration/mirror-fields:
    post:
      summary: Add a mirror field
      description: |
        Adds a field to the board that mirrors a field of another board. The new field takes the
        target field's type (and, for select types, a copy of its option list), is named
        `Mirror <target field name>` unless you supply `name`, and is read-only unless you set
        `readOnly: false`.

        This only adds the field - the same as the Aptly app. A card shows a mirrored value once
        it is linked to a card on the target board (for example through a related-cards field) and
        is next saved; existing cards are not backfilled when the field is added.

        Requires `update` permission and the key's "Edit Boards" access (off by default). A key's
        board allowlist applies to **both** boards: the target board must be one the key can access
        and must be API-enabled. The target field must be one of `string`, `text`, `rich-text`,
        `address`, `email`, `url`, `datetime-local`, `date`, `number`, `percent`, `stageselect`,
        `singleselect`, `multiselect`, `tags`, `boolean`, `person`, `persons`, `relatedAptlets`,
        `files`, `file`, `money`, `user` or `lockAlias`, and can't itself be a mirror field. Mirroring
        the same target field twice on one board returns `409`.
      operationId: addBoardMirrorField
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          description: The board that gets the mirror field.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetBoardUuid, targetFieldUuid]
              properties:
                targetBoardUuid:
                  type: string
                  description: The uuid of the board to mirror a field from.
                targetFieldUuid:
                  type: string
                  description: The uuid of the field on that board to mirror.
                name:
                  type: string
                  description: Display name for the new field. Defaults to `Mirror <target field name>`.
                readOnly:
                  type: boolean
                  description: Whether users may edit the mirrored value on this board. Defaults to `true`.
            example:
              targetBoardUuid: "deals"
              targetFieldUuid: "rent"
              name: "Deal rent"
      responses:
        "201":
          description: The created field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BoardField"
              example:
                data:
                  uuid: "Qk3x9TnWc2LmPa8vR"
                  name: "Deal rent"
                  type: "money"
                  optional: true
                  pinned: false
                  position: 12
                  readOnly: true
                  metricField: false
                  mirrorTarget:
                    targetAptletUuid: "deals"
                    targetFieldUuid: "rent"
        "400":
          description: >-
            `VALIDATION_ERROR` (per-field `meta.issues`), or the target field's type can't be
            mirrored, or the target field is itself a mirror field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
        "403":
          description: >-
            The key lacks `update` permission or the "Edit Boards" access, either board is outside
            the key's board allowlist, or the board or target board isn't API-enabled.
        "404":
          description: The board, the target board or the target field was not found.
        "409":
          description: >-
            The board already mirrors that target field. `meta.fieldUuid` is the existing mirror field.


  /api/board/{boardId}/configuration/fields/{fieldUuid}:
    put:
      summary: Update a field
      description: |
        Updates a field's `name`, `optional`, `pinned`, `defaultValue` and - for select-type fields -
        its full `data` option list. A field's `type` and `uuid` never change. Options re-sent by label
        keep their uuid. Refused (403) for locked fields and the options of integration-managed
        fields. Requires `update` permission and "Edit Boards" access (not needed on a board that
        same key created).

        **Editing the stage pipeline** (`fieldUuid` = `stage`): send the full `data` list in the order
        you want. You can add stages, reorder them and recolor them. Existing stages are matched by
        `uuid` (or by `label` when you leave `uuid` out) and keep their `uuid`. A stage that isn't
        matched is added: it gets a new `uuid` and may set `color`, `closed` and `won` (`won` is for
        deal boards only and implies `closed`). Cards, automations and saved filters refer to stages
        by name, so these are refused with 403: leaving an existing stage out (removing it), changing
        an existing stage's `label` (renaming it) and changing an existing stage between open,
        closed and won. The first stage is where new cards start, so whichever stage ends up first
        must be open (unless it was already first). Labels must be unique and there can be at most 30
        stages. Board views that are open in the Aptly app refresh to show the change.
      operationId: updateBoardField
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: fieldUuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                optional:
                  type: boolean
                pinned:
                  type: boolean
                defaultValue:
                  type: string
                data:
                  type: array
                  items:
                    type: object
                    required: [label]
                    properties:
                      label:
                        type: string
                      uuid:
                        type: string
                      color:
                        type: string
                        example: "#1ec968"
                        description: Stage field only. Hex color.
                      closed:
                        type: boolean
                        description: >-
                          Stage field only. For an existing stage it must match the stage as it is;
                          for a new stage it makes it a closed stage.
                      won:
                        type: boolean
                        description: >-
                          Stage field only. For an existing stage it must match the stage as it is;
                          for a new stage on a deal board it makes it a won stage.
      responses:
        "200":
          description: The updated field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BoardField"
        "400":
          description: "`VALIDATION_ERROR` (per-field `meta.issues`) or a rule violation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
        "403":
          description: >-
            The key lacks `update` permission or the "Edit Boards" access, the board isn't API-enabled,
            or the field can't be changed (locked, standard, mirror or integration-managed).
        "404":
          description: Board (or field) not found.
    delete:
      summary: Delete a field
      description: |
        Removes a field from the board (card values already stored for it are left in place). Refused
        for standard fields (`name`, `stage`, `description`, `tags`, `checklist`, `files`,
        `lastAction`, `dueAt`, `relatedContacts`), locked, mirror and integration-managed fields (403),
        and - as in the Aptly app - for a field used by a saved filter, or by a workflow or automation
        that runs off one (409 `CONFLICT`, with the dependents in `meta`). Requires `update` permission
        and "Edit Boards" access (not needed on a board that same key created).
      operationId: deleteBoardField
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: fieldUuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Field deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                      deleted:
                        type: boolean
        "401":
          description: Invalid or missing API key.
        "403":
          description: Missing permission or "Edit Boards" access, or the field can't be deleted.
        "404":
          description: Board or field not found.
        "409":
          description: The field is used by saved filters, workflows or automations.


