openapi: 3.0.3
info:
  title: Aptly API
  version: "1.1"
  description: |
    The Aptly API lets external systems work with boards, contacts, inboxes,
    tasks, files, and other Aptly resources.

    Most endpoints accept an API key in the `x-token` header. Some endpoints
    also accept a delegate token or partner bearer token, as shown in each
    operation's security requirements, and explicitly public endpoints require
    no credential. API keys are scoped to a company and may be restricted to
    specific boards and read, insert, or update permissions; requests outside
    those restrictions receive a 403 `FORBIDDEN` response.

servers:
  - url: https://core-api.getaptly.com
    description: Production

security:
  - ApiKeyHeader: []

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-token
    DelegateToken:
      type: apiKey
      in: header
      name: Authorization
      description: "Delegate token issued by the platform. Format: `DelegateToken <token>`"
    PartnerBearer:
      type: http
      scheme: bearer
      description: "Partner token. Format: `Authorization: Bearer <token>`"

  schemas:
    BoardFilterRule:
      type: object
      properties:
        fieldUuid:
          type: string
          description: "Field uuid from the board catalog (HIRO: get_board_fields.fields); system fields include assignee, stage, updatedAt."
        key:
          type: string
          description: Exact filter key from the field's filters array. Required to select a subfield when one uuid has multiple filters.
        operator:
          type: string
          description: Supported operator from the filter's operatorSet in the catalog's operatorSets dictionary. Greater-than is spelled gratherThan for saved-rule
            compatibility.
        value:
          description: >-
            between takes [minimum, maximum], e.g. ["2026-09-28", "2026-10-04"] for ISO dates or [0, 100] for numbers.
            Money values are {amount: cents, currency?: string}; money ranges use two such objects.
            anyIn/notIn require nonempty arrays of option values, user ids, booleans/null, or contact {_id} objects as appropriate for the field.
            Use option.value when present, otherwise the literal option string/label.
            Contact equal uses {_id}. Date comparisons use ISO dates; specificPeriod uses {period: dayOfYear|month|quarter|year|week, adjustment?: integer}.
            For feeAmount fields, wrap any supplied value in {end: value}, including {end: [minimum, maximum]} for between.
            Omit value for noValue operators.
        valueSource:
          type: string
          enum:
            - currentUser
          description: For user anyIn/notIn rules, resolves the authenticated/selected user on the server. Omit value.
        valueFieldUuid:
          type: string
          description: Optional comparison field uuid or catalog key; equal, notEqual, lessThan, gratherThan only. Omit value.
        defaultValueField:
          type: string
          description: Optional catalog field/key used if the filtered field is missing.
      required:
        - fieldUuid
        - operator
    BoardCardListRequest:
      type: object
      required:
        - page
      properties:
        page:
          type: integer
          minimum: 0
          maximum: 9999
          description: Zero-based page number.
        pageSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
          description: Number of cards per page.
        updatedAtMin:
          type: string
          format: date-time
          description: Only return cards updated after this ISO timestamp.
        includeArchived:
          type: boolean
          default: false
          description: Include archived cards. If omitted, an explicit archived rule controls archive selection;
            otherwise active cards only. An explicit false intersects with the rules.
        relatedId:
          type: string
          description: Only return cards where `references.value` contains this ID.
        contactEmail:
          type: string
          description: Resolves the email to contact IDs, then filters cards referencing those contacts.
        keyTerm:
          type: string
          description: Full-text autocomplete search on card title using the Atlas Search index.
        assignee:
          type: string
          description: Filter cards by assignee user ID.
        segmentId:
          type: string
          maxLength: 256
          description: Existing accessible, active segment on this board; mutually exclusive with rules.
        rules:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BoardFilterRule"
          description: Ad hoc saved-segment rules, ANDed together. Requires an explicit board. Supply rules OR
            segmentId. Invalid rules are rejected.
        userId:
          type: string
          maxLength: 256
          description: Active company member whose private segments/currentUser values to use. API keys/partners may
            select a member; delegates cannot select another user.
      description: Read-only card listing. Supply segmentId OR rules; existing simple filters intersect with either.
        Segment/rule queries exclude deleted cards unless explicitly selected by a rule. No filter or card is
        saved. Saved segments must contain a rules array; missing or malformed rules require re-saving.
        An explicitly empty rules array matches all cards within the remaining filters.
    ContactConversationsResponse:
      type: object
      required:
        - personIds
        - conversations
        - hasMore
        - skip
        - limit
      properties:
        personIds:
          type: array
          items:
            type: string
        conversations:
          type: array
          items:
            type: object
            required:
              - _id
              - subject
              - description
              - messageCount
            properties:
              _id:
                type: string
                description: Conversation stream ID.
              subject:
                type: string
                nullable: true
              description:
                type: string
                maxLength: 500
              type:
                type: string
              status:
                type: integer
                description: 0 closed, 1 open, 2 waiting, 3 replied.
              assigneeId:
                type: string
                nullable: true
              participants:
                type: array
                items:
                  type: string
              channel:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
              messageCount:
                type: integer
              metrics:
                type: object
                properties:
                  lastMessageAt:
                    type: string
                    format: date-time
                  lastActivityAt:
                    type: string
                    format: date-time
                    nullable: true
                  lastMessageDirection:
                    type: string
                    enum:
                      - in
                      - out
                    nullable: true
        hasMore:
          type: boolean
          description: When true, request the next page with skip + limit.
        skip:
          type: integer
        limit:
          type: integer

    Card:
      type: object
      properties:
        cardId:
          type: string
          description: Unique ID of the card.
        boardUuid:
          type: string
          description: UUID of the board this card belongs to.
        archived:
          type: boolean
        assignee:
          type: string
          description: Full name of the assigned user.
        lastActivity:
          type: object
          nullable: true
          description: >-
            Most recent conversation activity on the card (email, SMS or call),
            or null if the card has none.
          properties:
            content:
              type: string
              nullable: true
              description: Body/text preview of the most recent message.
            type:
              type: string
              nullable: true
              description: Activity type, e.g. `email`, `sms`, `voice`.
            direction:
              type: string
              nullable: true
              enum: [in, out]
              description: Direction of the message — `in` (inbound) or `out` (outbound).
            publishedAt:
              type: string
              format: date-time
              nullable: true
            conversationUrl:
              type: string
              nullable: true
              description: >-
                Deep link to the conversation thread in Aptly. Null when the
                activity is not attached to a thread.
      additionalProperties:
        description: >-
          Additional properties are dynamic board fields keyed by their field
          UUID. Fields of type `files` come back as an array of file objects and
          type `file` as a single file object — `{ fileId, name, size, type,
          url, expiresAt }`, where `url` is a presigned download link valid
          until `expiresAt` (1 hour, or sooner if the signing session ends
          first). An id with no readable file record degrades to
          `{ fileId }` with no `url`.

    InboxThreadMetrics:
      type: object
      description: >-
        Stored metrics for one thread. Response times are in business hours, using
        the company's configured business hours and holidays.
      properties:
        firstResponseHrs:
          type: number
          nullable: true
          description: Time to the first reply. Null when nobody has replied.
        avgResponseHrs:
          type: number
          nullable: true
        responseCount:
          type: integer
          description: Replies the averages were computed from.
        reopened:
          type: boolean
          description: True when an inbound arrived after the thread was closed.
        touchCount:
          type: integer
          description: Total messages in the thread, both directions.
        inboundCount:
          type: integer
        outboundCount:
          type: integer
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        lastMessageDirection:
          type: string
          nullable: true
          enum: [in, out]

    InboxMessage:
      type: object
      properties:
        messageId:
          type: string
        threadId:
          type: string
        subject:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          description: e.g. `email`, `sms`, `voice`.
        timestamp:
          type: string
          format: date-time
        direction:
          type: string
          enum: [in, out]
        from:
          type: object
          nullable: true
          description: Sender, as `{ id, name }` where `id` is an email address or phone number.
        to:
          type: array
          items:
            type: object
          description: Recipients, each as `{ id, name }`.
        sentByUser:
          type: string
          nullable: true
          description: Aptly user id that sent an outbound, when known.
        sentVia:
          type: string
          nullable: true
          enum: [aptly, native]
          description: >-
            How an outbound message was sent: `aptly` when it was composed in Aptly,
            `native` when the user sent it from their own mail client and it synced
            in. Always `null` on inbound messages.

    InboxThread:
      type: object
      properties:
        threadId:
          type: string
        subject:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum: [closed, new, open, sent]
          description: >-
            The conversation's status, mapped from the stream's numeric `status`
            field (0 closed, 1 new, 2 open, 3 sent). `null` when the thread has
            no status, or an unrecognized one.
        isJunk:
          type: string
          nullable: true
          enum: [archived, not_junk, junk]
          description: >-
            The thread's junk state, mapped from the stream's numeric `isJunk`
            field (-1 archived, 0 not junk, 1 junk). `null` when the thread has
            no value, or an unrecognized one. Junk threads are excluded from the
            listing unless `includeJunk=true`.
        unread:
          type: boolean
          description: >-
            Whether the thread is marked unread, from the stream's 0/1 `unread`
            flag. Absent on the stream means read.
        assigneeId:
          type: string
          nullable: true
          description: Assigned Aptly user id, or null when unassigned.
        type:
          type: string
          nullable: true
        participants:
          type: array
          items:
            type: string
          description: Email addresses / phone numbers taking part in the thread.
        labels:
          type: array
          description: >-
            Folder labels applied to the thread, each as `{ id, name }`. Only real
            folder labels are returned — the encoded scoping ids also stored on a
            thread (channel, assignee, mention, person type, category) are omitted.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                nullable: true
        metrics:
          $ref: "#/components/schemas/InboxThreadMetrics"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxMessage"

    InboxMetricSet:
      type: object
      description: >-
        Averages and rates are null (not 0) when the window has nothing to measure.
      properties:
        threadCount:
          type: integer
        contactCount:
          type: integer
          description: Distinct counterparts across the matching threads.
        volume:
          type: object
          properties:
            in:
              type: integer
            out:
              type: integer
            total:
              type: integer
        avgFirstResponseHrs:
          type: number
          nullable: true
        avgResponseHrs:
          type: number
          nullable: true
        responseCount:
          type: integer
          description: Replies the averages were computed from.
        oneTouchPct:
          type: number
          nullable: true
          description: Percentage of threads resolved with a single outbound.
        oneTouchCount:
          type: integer
        reopenRatePct:
          type: number
          nullable: true
        reopenedCount:
          type: integer
        noCustomerResponseCount:
          type: integer
          description: Threads where we sent something and never got a reply.
        awaitingOurReplyCount:
          type: integer
          description: Open threads where the counterpart spoke last.
        sentiment:
          $ref: "#/components/schemas/InboxSentiment"

    InboxSentiment:
      type: object
      description: >-
        AI sentiment for the window. Scores are produced on write by the
        enhancement pipeline, only for inboxes where it is switched on, so
        `coverage` is always reported next to the average — an average over a
        fraction of the threads must not be read as covering all of them.
      properties:
        enabled:
          type: boolean
          description: >-
            Whether sentiment scoring is currently on for this inbox (org AI
            assistant + org sentiment + the inbox's own feature flag). Reported at
            the inbox level only, not per group.
        avg:
          type: number
          nullable: true
          description: Mean score across scored threads. Null when none were scored.
        coverage:
          type: object
          properties:
            scoredThreads:
              type: integer
            threadCount:
              type: integer
            pct:
              type: number
              nullable: true

    InboxTopic:
      type: object
      description: >-
        A topic (category) the enhancement pipeline or a teammate applied to
        threads in the window. Topics the company no longer defines are omitted.
      properties:
        topicId:
          type: string
        label:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        threadCount:
          type: integer

    InboxHealth:
      type: object
      properties:
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        baseline:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            periods:
              type: integer
            avgVolume:
              type: number
              nullable: true
              description: Mean volume per period across the baseline span.
            sufficient:
              type: boolean
              description: >-
                False when the baseline span carried no volume. Everything derived
                from the baseline is null in that case.
        volume:
          type: integer
          description: Messages in the requested window.
        volumeVsBaselinePct:
          type: number
          nullable: true
          description: >-
            Percentage change against the baseline average. Negative is a decline.
            Null when `baseline.sufficient` is false.
        trend:
          type: string
          enum: [falling, rising, flat, unknown]
          description: >-
            Second half of the window vs. the first. `unknown` when the window is
            too short to split.
        severityScore:
          type: integer
          nullable: true
          description: 0–100, tracking decline magnitude. 0 for flat or growing volume.
        severityLabel:
          type: string
          enum: [critical, high, moderate, low, none, insufficient_history]
        tags:
          type: array
          items:
            type: string
          description: >-
            Human-readable flags, e.g. `Usage down`, `No activity`, `Still falling`.

    InboxTrendPeriod:
      type: object
      properties:
        period:
          type: string
          description: >-
            Period key. `YYYY-MM-DD` for day and week (week = the Monday it starts),
            `YYYY-MM` for month, `YYYY-Qn` for quarter.
        volume:
          type: object
          description: Messages sent or received during this period.
          properties:
            in:
              type: integer
            out:
              type: integer
            total:
              type: integer
        threadCount:
          type: integer
          description: Threads whose last activity fell in this period.
        avgResponseHrs:
          type: number
          nullable: true
          description: Business hours. Null when the period had no replies.
        responseCount:
          type: integer
          description: Replies behind avgResponseHrs.
        avgFirstResponseHrs:
          type: number
          nullable: true
        oneTouchPct:
          type: number
          nullable: true
        reopenRatePct:
          type: number
          nullable: true

    InboxAnalytics:
      allOf:
        - $ref: "#/components/schemas/InboxMetricSet"
        - type: object
          properties:
            window:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  nullable: true
                to:
                  type: string
                  format: date-time
                  nullable: true
            topics:
              type: array
              items:
                $ref: "#/components/schemas/InboxTopic"
            groupBy:
              type: string
              nullable: true
              enum: [assignee, contactType]
            groups:
              type: array
              description: Present only when `groupBy` was supplied.
              items:
                allOf:
                  - type: object
                    properties:
                      key:
                        type: string
                        nullable: true
                        description: Assignee user id or contact-type id. Null for unassigned.
                      label:
                        type: string
                        nullable: true
                  - $ref: "#/components/schemas/InboxMetricSet"

    SchemaField:
      type: object
      properties:
        key:
          type: string
          description: Field UUID — use this as the key when reading/writing card data.
        label:
          type: string
          description: Human-readable field name.
        type:
          type: string
          description: Field type (e.g. text, date, money, multiselect, etc.)

    Comment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    TabView:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        url:
          type: string
        icon:
          type: string
        embedSource:
          type: string
        type:
          type: string

    Contact:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the contact.
        uuid:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        fullName:
          type: string
          description: Computed display name (first + last, or company name for org records).
        duogram:
          type: string
          description: Two-letter initials derived from first and last name.
        photoId:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
          description: CDN thumbnail URL for the contact's photo, or null if none.
        email:
          type: string
        phone:
          type: string
        typeId:
          type: string
        companyId:
          type: string
        address:
          type: object
        title:
          type: string
        alerts:
          type: array
          items:
            type: object
        company:
          type: string
          description: Company name — populated when isCompany is true.
        isCompany:
          type: boolean

    KnowledgeDocSummary:
      type: object
      description: Lite shape returned by the list/tree/children knowledge endpoints (no rendered HTML).
      properties:
        _id:
          type: string
          description: Document ID.
        name:
          type: string
          description: Document title.
        emoji:
          type: string
          nullable: true
        iconUrl:
          type: string
          nullable: true
        accessType:
          type: string
          enum: [public, publicReadonly, private]
        parentId:
          type: string
          nullable: true
          description: Parent document ID, or null for a root document.
        rank:
          type: integer
          nullable: true
          description: Sort order among siblings. May be null.
        archived:
          type: boolean

    KnowledgeTreeNode:
      allOf:
        - $ref: "#/components/schemas/KnowledgeDocSummary"
        - type: object
          properties:
            hasChildren:
              type: boolean
              description: Whether this document has at least one child, whether or not it was expanded.
            matched:
              type: boolean
              description: >
                Only present when at least one of the tree endpoint's filter parameters
                (aptletUuid, aptletInstanceId, streamId, search, archived, ownerId,
                updatedById, createdFrom, createdTo, updatedFrom, updatedTo, unlinked) is
                active. `true` for a document that directly matched the filters; `false`
                for a node kept only as ancestor/descendant context around a match.
            children:
              type: array
              items:
                $ref: "#/components/schemas/KnowledgeTreeNode"
              description: >
                Nested nodes, present up to the requested `depth`. When a filter is
                active, this is pruned to matches plus their ancestors/descendants within
                the tree rather than every child.

    KnowledgeDoc:
      type: object
      description: Full document detail returned by GET /api/knowledge/{id}.
      properties:
        _id:
          type: string
          description: Document ID.
        name:
          type: string
          description: Document title.
        emoji:
          type: string
          nullable: true
        iconUrl:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        accessType:
          type: string
          enum: [public, publicReadonly, private]
        isPrivate:
          type: boolean
        shares:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [user, team]
              permission:
                type: string
                enum: [edit, comment, view]
              owner:
                type: boolean
              createdAt:
                type: string
                format: date-time
                nullable: true
              updatedAt:
                type: string
                format: date-time
                nullable: true
        parentId:
          type: string
          nullable: true
        path:
          type: array
          description: Root-first ancestor chain (folders above this document). Excludes this document.
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              emoji:
                type: string
                nullable: true
        children:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              emoji:
                type: string
                nullable: true
              rank:
                type: integer
                nullable: true
        childCount:
          type: integer
        links:
          type: object
          properties:
            aptletUuid:
              type: string
              nullable: true
            aptletInstanceId:
              type: string
              nullable: true
            streamId:
              type: string
              nullable: true
        published:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        views:
          type: object
          properties:
            internal:
              type: integer
            public:
              type: integer
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true
        currentUser:
          type: object
          nullable: true
          description: >
            Null for API key / partner token callers — those credentials are company-wide,
            so no per-user permission check is applied. Populated only for a delegate token,
            where the caller's own user identity is known.
          properties:
            userId:
              type: string
            isOwner:
              type: boolean
            permission:
              type: string
              nullable: true
              enum: [edit, comment, view, null]
            canView:
              type: boolean
            canEdit:
              type: boolean
            canComment:
              type: boolean
        html:
          type: string
          description: >-
            Document body rendered as HTML. Aptly custom blocks and inline items appear as
            elements with `data-content-type` / `data-inline-content-type` and `data-*`
            property attributes, plus a readable label — see "HTML format" in
            `PUT /api/knowledge/{id}`.

    EmailRecipient:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Email address.
        label:
          type: string
          description: Optional display name for the recipient.

    Board:
      type: object
      properties:
        uuid:
          type: string
          description: Board UUID — use this as `boardId` in board/card endpoints.
        name:
          type: string
          description: Display name of the board.
        endpoints:
          type: array
          description: Pre-built endpoint URLs for this board.
          items:
            type: object
            properties:
              method:
                type: string
                description: HTTP method.
              url:
                type: string
                description: Full endpoint URL.
              description:
                type: string
                description: What the endpoint does.

    NewBoardFieldType:
      type: string
      description: |
        The field types that can be created through the API (`POST /api/boards` and
        `POST /api/board/{boardId}/configuration/fields`). The value column is what a card stores
        and what the card API (`POST /api/board/{boardId}`) accepts under the field's `uuid`.

        | `type` | Label | Card value |
        |---|---|---|
        | `string` | Short Text | string |
        | `text` | Long Text | string |
        | `rich-text` | Rich Text | string (HTML) |
        | `number` | Number | number |
        | `money` | Currency | decimal number in requests (`1500.5`); returned as `{ amount, currency }` |
        | `percent` | Percent | number |
        | `multiplier` | Multiplier | number |
        | `boolean` | Checkbox | boolean |
        | `date` | Date | date |
        | `datetime-local` | Date and Time | date |
        | `email` | Email | string |
        | `emails` | Multiple Emails | string[] |
        | `tel` | Phone Number | string |
        | `phones` | Multiple Phone Numbers | array of phone objects |
        | `url` | URL | string |
        | `address` | Address | address object |
        | `person` | Link to a Single Contact | `{ _id }` (or `null` to clear); the contact must exist |
        | `persons` | Link to Multiple Contacts | array of `{ _id }` |
        | `user` | Team Member | user id |
        | `file` | Single Attachment | file id |
        | `files` | Multiple Attachments | file ids |
        | `heroImage` | Cover Photo | file id (the card's Kanban thumbnail) |
        | `embedVideo` | Embed Video | video URL string |
        | `stringList` | Text List | string[] |
        | `tags` | Tags | string[] |
        | `singleselect` | Dropdown | the chosen option's label - **requires `data`** |
        | `multiselect` | Multiple Select | array of option labels - **requires `data`** |
        | `checkboxlist` | Task List | array of `{ _id, checked, title }` (no `data`) |

        Relational and system types (`relatedAptlets`, `mirror`, `location`, `unit`, `stageselect`,
        `calculation`, and similar) can't be created through the API; boards built in the Aptly app
        can still contain them and they appear when reading fields.
      enum:
        - string
        - text
        - rich-text
        - number
        - money
        - percent
        - multiplier
        - boolean
        - date
        - datetime-local
        - email
        - emails
        - tel
        - phones
        - url
        - address
        - person
        - persons
        - user
        - file
        - files
        - heroImage
        - embedVideo
        - stringList
        - tags
        - singleselect
        - multiselect
        - checkboxlist
    AutomationTrigger:
      description: What starts the automation. Exactly one `type`.
      oneOf:
        - $ref: "#/components/schemas/AutomationStageTrigger"
        - $ref: "#/components/schemas/AutomationSegmentTrigger"
        - $ref: "#/components/schemas/AutomationReplyTrigger"
      discriminator:
        propertyName: type
        mapping:
          stage: "#/components/schemas/AutomationStageTrigger"
          segment: "#/components/schemas/AutomationSegmentTrigger"
          reply: "#/components/schemas/AutomationReplyTrigger"
    AutomationStageTrigger:
      type: object
      additionalProperties: false
      required: [type, stage]
      properties:
        type: { type: string, enum: [stage] }
        stage:
          type: string
          description: A stage of the board, spelled exactly as it is on the board (case and spacing included). A stage trigger fires at most once per card.
    AutomationSegmentTrigger:
      type: object
      additionalProperties: false
      required: [type, conditions]
      properties:
        type: { type: string, enum: [segment] }
        conditions:
          type: array
          minItems: 1
          maxItems: 25
          description: |
            Rules a card must meet, ANDed together - the same rule format as board segments (`fieldUuid`,
            `operator`, `value`, ...; see `GET /api/board/{boardId}/segments`). At least one rule is
            required, because an automation with no conditions would run on every card. A rule on an
            unknown field, an operator the field doesn't support, a missing or malformed value, a stage or
            option that isn't on the board, or a user who isn't in the company is rejected, as are rules
            on `archived`/`deleted` and `valueSource: currentUser` (an automation runs without a signed-in
            user). The rules are saved as a segment named `Automation - <title>`.
          items:
            type: object
        frequency:
          type: string
          enum: [everyTime, once]
          default: everyTime
          description: "`once` fires the first time a card matches; `everyTime` fires again each time it stops and starts matching."
    AutomationReplyTrigger:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [reply] }
        stages:
          type: array
          maxItems: 50
          default: []
          description: Only fire for cards in these stages. Empty means any stage.
          items: { type: string }
        frequency: { type: string, enum: [everyTime, once], default: everyTime }
        audience:
          type: string
          enum: [anyone, relatedContacts]
          default: anyone
          description: "`relatedContacts` requires the sender to be a contact related to the card."
        reopenArchived:
          type: boolean
          default: false
          description: Reopen an archived card when a reply arrives.
    AutomationTiming:
      description: |
        When the actions run after the trigger. Defaults to `{ "mode": "now" }`. A trigger with
        `frequency: once` can only use `now` or `after`. Times of day are hours (0-23) in the
        organization's time zone, and the automation fires within four hours after that time.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [now] }
            useBusinessHours:
              type: boolean
              default: false
              description: Only fire while the board or organization is open. Rejected when no business hours are configured, because it would never run.
        - type: object
          additionalProperties: false
          required: [mode, amount, unit]
          properties:
            mode: { type: string, enum: [after] }
            amount: { type: integer, minimum: 1, maximum: 100000 }
            unit: { type: string, enum: [minutes, hours, days, months] }
            anchor:
              type: string
              default: stageUpdatedAt
              description: What the delay counts from - `stageUpdatedAt`, `conditionMet`, `createdAt`, or the uuid of a date field on the board.
            timeOfDay:
              type: integer
              minimum: 0
              maximum: 23
              description: Only for `days` or `months`.
            useBusinessHours:
              type: boolean
              default: false
              description: Only for `minutes` or `hours`.
        - type: object
          additionalProperties: false
          required: [mode, day, timeOfDay]
          properties:
            mode: { type: string, enum: [dayOfWeek] }
            day: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday] }
            timeOfDay: { type: integer, minimum: 0, maximum: 23 }
        - type: object
          additionalProperties: false
          required: [mode, days, timeOfDay]
          properties:
            mode: { type: string, enum: [daysOfWeek] }
            days:
              type: array
              minItems: 1
              maxItems: 7
              description: 0 = Sunday ... 6 = Saturday. No repeats.
              items: { type: integer, minimum: 0, maximum: 6 }
            timeOfDay: { type: integer, minimum: 0, maximum: 23 }
        - type: object
          additionalProperties: false
          required: [mode, day, timeOfDay]
          properties:
            mode: { type: string, enum: [dayOfMonth] }
            day: { type: integer, minimum: 1, maximum: 31, description: 31 means the last day of the month. }
            timeOfDay: { type: integer, minimum: 0, maximum: 23 }
        - type: object
          additionalProperties: false
          required: [mode, startDay, endDay, timeOfDay]
          properties:
            mode: { type: string, enum: [dateRange] }
            startDay: { type: integer, minimum: 1, maximum: 31 }
            endDay: { type: integer, minimum: 1, maximum: 31, description: Must be after startDay. }
            timeOfDay: { type: integer, minimum: 0, maximum: 23 }
        - type: object
          additionalProperties: false
          required: [mode, interval]
          properties:
            mode: { type: string, enum: [everyXDays] }
            interval: { type: integer, minimum: 1, maximum: 365 }
            startImmediately: { type: boolean, default: true }
            timeOfDay: { type: integer, minimum: 0, maximum: 23 }
      discriminator:
        propertyName: mode
    AutomationRecipient:
      description: Who an email or SMS goes to.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties: { type: { type: string, enum: [assignee] } }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [relatedContacts] }
        - type: object
          additionalProperties: false
          required: [type, contactTypeIds]
          properties:
            type: { type: string, enum: [contactTypes] }
            contactTypeIds:
              type: array
              minItems: 1
              maxItems: 25
              description: Contact type ids of the organization. Related contacts of these types receive the message.
              items: { type: string }
        - type: object
          additionalProperties: false
          required: [type, addresses]
          properties:
            type: { type: string, enum: [specific] }
            addresses:
              type: array
              minItems: 1
              maxItems: 25
              description: Email addresses for an email, E.164 phone numbers (+15551234567) for an SMS. No repeats.
              items: { type: string }
        - type: object
          additionalProperties: false
          required: [type, fieldUuid]
          properties:
            type: { type: string, enum: [field] }
            fieldUuid:
              type: string
              description: An email, user or contact field of the board (an SMS needs a user or contact field).
      discriminator:
        propertyName: type
    AutomationAction:
      description: |
        One thing the automation does. Actions run in order. At most one `stage`, one `due_date` and one
        archive action per automation. Every id, stage and field named here must exist on the board /
        organization or the whole request is rejected.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, inbox, templateId, to]
          description: Send an email.
          properties:
            type: { type: string, enum: [email] }
            inbox: { type: string, description: 'The sending inbox id, or "assignee" for the card assignee''s inbox. Must be an active email inbox with users.' }
            templateId: { type: string, description: An active email template of the organization. }
            to: { $ref: "#/components/schemas/AutomationRecipient" }
            cc:
              type: array
              maxItems: 10
              default: []
              items: { type: string, format: email }
            deliveryMode:
              type: string
              enum: [multiple, single]
              default: multiple
              description: "`single` sends one email to all recipients; `multiple` sends each their own."
            fallback:
              type: object
              additionalProperties: false
              required: [inbox, templateId]
              description: Send an SMS instead to recipients with no email address. Needs an active phone inbox and an SMS template.
              properties:
                inbox: { type: string }
                templateId: { type: string }
        - type: object
          additionalProperties: false
          required: [type, inbox, templateId, to]
          description: Send a text message.
          properties:
            type: { type: string, enum: [sms] }
            inbox: { type: string, description: 'The sending phone inbox id, or "assignee".' }
            templateId: { type: string, description: An active SMS template of the organization. }
            to: { $ref: "#/components/schemas/AutomationRecipient" }
            fallback:
              type: object
              additionalProperties: false
              required: [inbox, templateId]
              description: Send an email instead to recipients with no phone number.
              properties:
                inbox: { type: string }
                templateId: { type: string }
        - type: object
          additionalProperties: false
          required: [type, source]
          description: Create tasks on the card, from a task template or defined inline.
          properties:
            type: { type: string, enum: [task] }
            source: { type: string, enum: [template, manual] }
            templateId: { type: string, description: "Required for `template`. A task template of this board." }
            tasks:
              type: array
              minItems: 1
              maxItems: 20
              description: Required for `manual`.
              items:
                type: object
                additionalProperties: false
                required: [title]
                properties:
                  title: { type: string, maxLength: 200 }
                  description: { type: string, maxLength: 2000 }
                  userId: { type: string, description: An active user of the organization. Defaults to the card assignee. }
                  dueInDays: { type: integer, minimum: 0, maximum: 365 }
                  dueFrom: { type: string, description: '"now" (default) or a date field uuid. Needs dueInDays.' }
            fieldUuid: { type: string, description: A task list (checkboxlist) field to put the tasks on. Defaults to the card's checklist. }
            useBusinessDays: { type: boolean, default: false, description: "Count the tasks' due dates in business days. Rejected when no business hours are configured, because the due dates would fall on calendar days instead." }
        - type: object
          additionalProperties: false
          required: [type, mode]
          description: Assign the card.
          properties:
            type: { type: string, enum: [assign] }
            mode: { type: string, enum: [user, team, roundRobin, contactField] }
            userId: { type: string, description: "Required for `user`." }
            teamId: { type: string, description: "Required for `team`. An active team." }
            contactFieldUuid: { type: string, description: "Required for `contactField`. A contact or user field of the board." }
            onlyIfUnassigned: { type: boolean, default: false }
        - type: object
          additionalProperties: false
          required: [type, fields]
          description: |
            Set field values. Supported field types and the value each takes: `string`/`text` (text),
            `email`, `url` (http/https), `tel` (E.164), `number`, `percent` (a fraction, 0.25 = 25%),
            `money` (`{ amount: whole cents, currency?: "USD" }`), `boolean`, `singleselect` (an option),
            `multiselect` (array of options), `tags` (added to the existing tags), `user` (a user id), and
            `date`/`datetime-local` (`{ from: "now" | <date field uuid>, days: integer }` or
            `{ clear: true }`). Read-only and computed fields, and every other field type, are rejected.
          properties:
            type: { type: string, enum: [update_fields] }
            fields:
              type: array
              minItems: 1
              maxItems: 20
              description: Each field at most once.
              items:
                type: object
                additionalProperties: false
                required: [fieldUuid, value]
                properties:
                  fieldUuid: { type: string }
                  value: {}
        - type: object
          additionalProperties: false
          required: [type, stage]
          description: Move the card to a stage of the board. Can't be the stage that triggered a stage automation.
          properties:
            type: { type: string, enum: [stage] }
            stage: { type: string }
        - type: object
          additionalProperties: false
          required: [type]
          description: Set or clear the card's due date.
          properties:
            type: { type: string, enum: [due_date] }
            from: { type: string, default: now, description: '"now", "clear", or a date field uuid.' }
            days: { type: integer, minimum: -366, maximum: 1999, description: Required unless `from` is "clear". }
            useBusinessDays: { type: boolean, description: 'Count `days` in business days. Not valid when `from` is "clear". Rejected when no business hours are configured, because the due date would fall on calendar days instead.' }
        - type: object
          additionalProperties: false
          required: [type]
          description: Post a notification comment on the card. At least one of userIds, teamIds, fieldUuids or notifyCardCreator is required.
          properties:
            type: { type: string, enum: [notify] }
            userIds: { type: array, maxItems: 25, default: [], items: { type: string } }
            teamIds: { type: array, maxItems: 25, default: [], items: { type: string } }
            fieldUuids: { type: array, maxItems: 10, default: [], description: User fields of the board., items: { type: string } }
            notifyCardCreator: { type: boolean, default: false }
            message: { type: string, maxLength: 1000, description: Plain text (no < or >). }
        - type: object
          additionalProperties: false
          required: [type]
          description: Archive the card.
          properties:
            type: { type: string, enum: [archive] }
        - type: object
          additionalProperties: false
          required: [type]
          description: Archive the card and its conversations.
          properties:
            type: { type: string, enum: [archive_convos] }
        - type: object
          additionalProperties: false
          required: [type, url]
          description: POST the card to a URL. The URL must be a public https address - localhost, private/internal addresses, credentials and non-default ports are rejected.
          properties:
            type: { type: string, enum: [webhook] }
            url: { type: string, maxLength: 2000 }
      discriminator:
        propertyName: type
    CreateAutomationRequest:
      type: object
      additionalProperties: false
      required: [title, trigger, actions]
      properties:
        title: { type: string, maxLength: 200 }
        trigger: { $ref: "#/components/schemas/AutomationTrigger" }
        timing: { $ref: "#/components/schemas/AutomationTiming" }
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/AutomationAction" }
    ValidationError:
      type: object
      description: |
        Returned with HTTP 400 when the request body fails shape validation (wrong type,
        missing required field, malformed email/phone number, value out of bounds).
        `meta.issues` lists every offending field.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
            message:
              type: string
              example: One or more fields are invalid
            meta:
              type: object
              properties:
                issues:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: Dotted path to the offending property (for example `to.0.value`); empty for a problem with the body as a whole.
                        example: to.0.value
                      code:
                        type: string
                        description: Machine-readable issue code (for example `invalid_type`, `invalid_format`, `too_small`).
                        example: invalid_format
                      message:
                        type: string
                        example: must be a valid email address
        requestId:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    TaskDateRange:
      type: object
      description: Date-range filter. Either bound may be supplied independently — `startDate` maps to `$gte`, `endDate` to `$lte`.
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        _id:
          type: string
        companyId:
          type: string
        title:
          type: string
        mergedTitle:
          type: string
          description: Title with `{{ }}` merge tags resolved against the task's representative contact, the company, and the acting user.
        description:
          type: string
        mergedDescription:
          type: string
          description: Description with `{{ }}` merge tags resolved (HTML output).
        userId:
          type: string
          description: Assigned user id.
        checked:
          type: boolean
        archived:
          type: boolean
        status:
          type: string
        priority:
          type: string
        dueAt:
          type: string
          format: date-time
        aptletInstanceId:
          type: string
        aptletUuid:
          type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              type:
                type: string
        priorityLabel:
          type: string
          description: Present only when includeMetadata=true.
        statusLabel:
          type: string
          description: Present only when includeMetadata=true.
        assignee:
          type: object
          description: Present only when includeMetadata=true.
          properties:
            _id:
              type: string
            fullName:
              type: string
      additionalProperties: true

    CardRule:
      type: object
      description: An older create-card rule (`board` or `schedule`) that moves or copies cards. Not an Automation.
      properties:
        uuid:
          type: string
          description: Unique identifier for the rule.
        title:
          type: string
          description: Display name of the automation.
        automationType:
          type: string
          enum: [board, schedule]
          description: "`board` automations move/copy cards based on board events; `schedule` automations run on a time-based schedule."
        archived:
          type: boolean
        destinationBoardUuid:
          type: string
          description: UUID of the destination board. Defaults to the current board.
        sourceBoardUuid:
          type: string
          description: (board type only) UUID of the source board.
        runMode:
          type: string
          description: "Board type: `continuously`, `onDate`, `onMonth`, `dateRange`, `onDayOfWeek`. Schedule type: `onDayOfWeek`, `onDate`, `onDayOfYear`."
        segment:
          description: (board type only) Card segment/stage filter.
        moveMode:
          type: string
          enum: [Copy, Move]
          description: (board type only) Whether to copy or move matching cards.
        timeOfDay:
          type: number
          description: (schedule type only) Hour of the day to run (0–23).

    BoardField:
      type: object
      properties:
        uuid:
          type: string
          description: Unique field identifier — use this as the key when reading/writing card data.
        name:
          type: string
          description: Display name of the field.
        type:
          type: string
          description: "Field type. Fields created through the API use one of the types in `NewBoardFieldType` (`string`, `text`, `rich-text`, `number`, `money`, `percent`, `multiplier`, `boolean`, `date`, `datetime-local`, `email`, `emails`, `tel`, `phones`, `url`, `address`, `person`, `persons`, `user`, `file`, `files`, `heroImage`, `embedVideo`, `stringList`, `tags`, `singleselect`, `multiselect`, `checkboxlist`). Mirror fields (a copy of another board's field) are added with `POST /api/board/{boardId}/configuration/mirror-fields` and take the mirrored field's type. Boards built in the Aptly app can also contain relational and system types, e.g. `stageselect`, `sourceselect`, `relatedAptlets`, `mirror`, `mirror-contact`, `location`, `unit`, `board`, `calculation`, `ai-computed`, `cardId`, `daysOpened`, `timeSince`, `qualified`, `lostReason`, `lostDetails`, `relatedEvents`, `relatedDocuments`, `contactType`, `teams`."
        position:
          type: integer
          description: Display order (zero-based).
        optional:
          type: boolean
          description: Whether the field is optional on cards.
        archived:
          type: boolean
          description: Whether the field has been archived (hidden from the UI).

    BoardOptions:
      type: object
      description: Configurable board-level settings. All fields are optional — only include the ones you want to change on PATCH.
      properties:
        conversionFlair:
          type: string
          enum: [confetti, fireworks]
        reassignDiscussions:
          type: string
          enum: ["", prompt, auto]
        minCallDuration:
          type: number
          description: Minimum call duration in seconds before the call is logged.
        boardEmailOnlyParsedCards:
          type: boolean
        displayFieldNames:
          type: boolean
        agingIndicator:
          type: boolean
        applicationFeatures:
          type: boolean
        applicationLinking:
          type: boolean
        defaultContactType:
          type: string
        updateBadgeField:
          type: string
          description: Field UUID to use as the card badge label.

    TemplateUpsert:
      type: object
      required: [name, description, templateType, subject, content]
      properties:
        companyId:
          type: string
          description: Required with a partner token; resolved from an API key or delegate token.
        userId:
          type: string
          description: >-
            The acting user. Required with an API key or partner token; a delegate token
            supplies its own.
        name:
          type: string
        description:
          type: string
        templateType:
          type: string
          enum: [sms, email, form, eSignature, pdf]
          description: >-
            Template kind. `blockDocument` is not accepted — it is an internal type for
            document blocks, not a user-facing template.
        subject:
          type: string
          description: >-
            Email subject, or the file name for a `pdf` template — in which case
            filename-illegal characters are stripped. Merge placeholders work here
            too, and are shape-checked the same way.
        content:
          type: string
          description: >-
            Template body. Merge placeholders take the form `{{value}}` or
            `{{value || fallback: text}}`, where `value` is an item's `value` from
            `GET /api/board/{boardId}/merge-fields` — for example `{{firstname}}`,
            `{{Locations["Rent"] || fallback: TBD}}`. They are checked for shape —
            an unclosed `{{`, an empty field name or a malformed bracket
            reference is rejected. Whether each field exists is not checked: an
            unknown one renders as its fallback at merge time.
        htmlBuilder:
          type: boolean
          enum: [false]
          default: false
          description: >-
            Must be `false` or omitted. HTML-builder templates keep their markup in a
            builder-owned `builderData` format and can only be authored in the app.
        builderData:
          type: object
          description: Builder document, when one already exists.
        folderId:
          type: string
          description: >-
            Library folder the template belongs to — must be an existing, non-archived
            folder in the company. Governs who may edit the template.
        aptletUuid:
          type: string
          description: >-
            Board the template is scoped to. Must be an existing, non-archived board in
            the company.
        signature:
          type: string
        attachmentIds:
          type: array
          items:
            type: string
          description: Uploaded file ids to attach.

    MergeFieldItem:
      type: object
      description: One selectable merge field — the display label and the body of the `{{ ... }}` token it inserts.
      properties:
        label:
          type: string
          description: Display label.
        value:
          type: string
          description: |
            The token body. Global groups use a bare key (`firstname`,
            `customFields.<id>.<NameWithoutSpaces>`, `nowDate`); board items use the
            `Board["Label"]` form (`Locations["Rent"]`, `Locations["Card Details"]`),
            except the unit/location link entries, which key on the raw name
            (`Locations["activeToursLink"]`).

    MergeFieldCatalog:
      type: object
      properties:
        recipient:
          type: array
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        board:
          type: array
          description: The fields and card entries of the board in the path. The hook's per-board `locations`/`aptlets` groups, flattened.
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        sender:
          type: array
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        showing:
          type: array
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        lease:
          type: array
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        application:
          type: array
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        general:
          type: array
          description: Today's date, attachment links, unsubscribe url. The `system` group in the Meteor hook.
          items:
            $ref: "#/components/schemas/MergeFieldItem"
        company:
          type: array
          description: Company name, address, contact details and logo. The `companyFields` group in the Meteor hook.
          items:
            $ref: "#/components/schemas/MergeFieldItem"

    Template:
      type: object
      properties:
        _id:
          type: string
          description: Template ID.
        companyId:
          type: string
          description: Company the template belongs to.
        name:
          type: string
          description: Template display name.
        templateType:
          type: string
          enum: [sms, email, form, eSignature, pdf, blockDocument]
          description: Template category.
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: User ID of the creator.
        updatedAt:
          type: string
          format: date-time
      additionalProperties:
        description: "Additional properties depend on the templateType (e.g. `subject`, `content` for email templates)."

    TourFeedback:
      type: object
      description: One tour showing's post-tour feedback survey.
      properties:
        showingId:
          type: string
          description: Showing (portal application) ID.
        status:
          type: string
          enum: [completed, pending]
          description: "`completed` once the applicant answered; `pending` while the survey is still out."
        sentAt:
          type: string
          format: date-time
          nullable: true
          description: When the survey was emailed to the applicant.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the applicant submitted their answers.
        tourDate:
          type: string
          format: date-time
          nullable: true
        instanceId:
          type: string
          nullable: true
          description: The location/unit card the tour was for.
        propertyName:
          type: string
          nullable: true
          description: Name of that location card.
        applicant:
          type: object
          properties:
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        responses:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
                nullable: true
                description: The question text as it was shown to the applicant.
              answer:
                type: string
                nullable: true
                description: The raw answer. Rating questions answer "1"-"5"; text questions answer free text.
              rating:
                type: integer
                nullable: true
                minimum: 1
                maximum: 5
                description: The answer as a number when it is a 1-5 rating, otherwise null.
        averageRating:
          type: number
          nullable: true
          description: Mean of this survey's numeric ratings, or null when nothing was rated.

paths:
  /api/users:
    get:
      summary: List users
      description: |
        Returns all non-archived users for the API key's company.
      operationId: listUsers
      tags: [Users]
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: User ID.
                        name:
                          type: string
                          description: Full name (firstname + lastname).
                        role:
                          type: string
                          nullable: true
                          description: Role name, or null if the role has been deleted.
              example:
                data:
                  - _id: "abc123"
                    name: "Alice Smith"
                    role: "Admin"
                  - _id: "def456"
                    name: "Bob Jones"
                    role: "Staff"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{userId}/inboxes:
    get:
      summary: List a user's email inboxes
      description: |
        Returns the email inboxes (Hermes/Nylas channels) accessible to the given user
        within your company. Includes personal inboxes (where the user is a direct member)
        and shared inboxes the user can access via team membership.

        Each inbox is tagged `kind: "personal"` (`isShared` is false and the user is in the
        channel's `userIds`) or `kind: "shared"` (channel marked `isShared`, or accessible
        only through a team membership).

        The user must belong to the company associated with your API key. Returns `401` if
        the user does not belong to your company.
      operationId: listUserInboxes
      tags: [Users]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The user's ID.
      responses:
        "200":
          description: List of inboxes accessible to the user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: Channel document ID.
                        channelId:
                          type: string
                          nullable: true
                          description: External channel meta ID (`meta.id`).
                        type:
                          type: string
                          description: "Channel transport type: `Hermes` or `Nylas`."
                        provider:
                          type: string
                          nullable: true
                          description: "Upstream provider, e.g. `google`, `office365`."
                        email:
                          type: string
                          nullable: true
                          description: Email address of the inbox.
                        name:
                          type: string
                          nullable: true
                          description: Display name of the inbox.
                        kind:
                          type: string
                          enum: [personal, shared]
                          description: Whether the user has personal or shared access.
              example:
                data:
                  - _id: "ch_abc"
                    channelId: "acc-1"
                    type: "Hermes"
                    provider: "google"
                    email: "alice@example.com"
                    name: "Alice's Inbox"
                    kind: "personal"
                  - _id: "ch_def"
                    channelId: "acc-2"
                    type: "Hermes"
                    provider: "google"
                    email: "leasing@example.com"
                    name: "Leasing Team"
                    kind: "shared"
        "401":
          description: Invalid or missing API key, or user does not belong to your company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inboxes:
    get:
      summary: List inboxes you can query
      description: |
        Returns the email and phone/SMS inboxes available to the credential, for use
        as the `channelId` on the messages and analytics endpoints.

        With delegate-token auth (`inboxes:*` scope) results are limited to
        inboxes the authenticated user can reach, and each entry carries `access`:
        `owned` when the user is a member of the inbox (directly or through a team),
        `monitored` when it is another user's private inbox that the caller is
        permitted to monitor. `scope` filters on that value.

        Monitoring requires the `conversations.monitor_admin` permission on the
        caller and `conversations.monitor_access` on the inbox owner's role, so a
        caller without those permissions sees only `owned` inboxes.

        API keys and partner tokens are company-scoped and carry no user identity, so
        they return every inbox in the company, omit `access`, and reject `scope`
        with a `400`.
      operationId: listInboxes
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [owned, monitored, all]
            default: all
          description: >-
            Filter by access type. Delegate-token auth only — rejected for
            company-scoped credentials.
      responses:
        "200":
          description: Inboxes available to the credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        channelId:
                          type: string
                          description: External channel meta ID (`meta.id`). Use this on the other inbox endpoints.
                        type:
                          type: string
                          enum: [email, phone]
                        provider:
                          type: string
                          nullable: true
                          description: Underlying provider, e.g. `gmail`, `office365`, `twilio`.
                        name:
                          type: string
                          nullable: true
                        email:
                          type: string
                          nullable: true
                          description: Set for email inboxes.
                        number:
                          type: string
                          nullable: true
                          description: Set for phone/SMS inboxes.
                        isShared:
                          type: boolean
                        access:
                          type: string
                          enum: [owned, monitored]
                          description: >-
                            Present only with delegate-token auth. `owned` = the user
                            is a member of the inbox; `monitored` = another user's
                            private inbox the caller may monitor.
        "400":
          description: Invalid `scope`, or `scope` used with a company-scoped credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.

  /api/inboxes/{channelId}/messages:
    get:
      summary: List threads and messages on an inbox
      description: |
        Returns threads on the inbox, newest activity first, each with its messages
        and stored per-thread metrics. Paging is over **threads**, not individual
        messages.

        The window filters on the thread's last message time and `dateTo` is
        exclusive. Automated/junk threads are excluded unless `includeJunk=true`.

        `sentVia` indicates whether an outbound was composed in Aptly (`aptly`) or
        sent from the user's own mail client and synced in (`native`). Inbound
        messages are always `null`.
      operationId: listInboxMessages
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
          description: ISO date. Only threads with activity at or after this time.
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
          description: ISO date, exclusive. Range must not exceed 400 days.
        - name: direction
          in: query
          schema:
            type: string
            enum: [in, out]
          description: Filter to threads whose most recent message went this way.
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            When true, return only unread threads. Unread is the thread's stored read state, a
            single flag shared by everyone with access to the inbox (a thread any teammate has
            opened counts as read). Applied before paging, so `count` reflects the filtered total.
        - name: includeJunk
          in: query
          schema:
            type: boolean
            default: false
          description: Include threads classified as junk/automated.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Zero-based page number (0–9999).
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 200
          description: Threads per page.
      responses:
        "200":
          description: Threads with their messages and metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxThread"
                  count:
                    type: integer
                    description: Total matching threads across all pages.
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid date range, paging, direction, or unreadOnly value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "403":
          description: The authenticated user cannot reach this inbox.
        "404":
          description: Inbox not found in your company.

  /api/inboxes/{channelId}/analytics:
    get:
      summary: Conversation analytics for an inbox
      description: |
        Aggregated conversation metrics for one inbox over a date range.

        Response times are **business-hours aware** — they use the company's
        configured business hours and holidays, the same basis as in-app reports, so
        figures reconcile. `responseCount` is the number of replies the averages were
        computed from.

        Averages and rates are `null` rather than `0` when the window contains
        nothing to measure. Automated/junk threads are excluded unless
        `includeJunk=true`.

        `sentiment` carries a numeric average plus the `coverage` it was computed
        from, and `enabled` reports whether scoring is currently switched on for the
        inbox. Scores exist only for threads the pipeline actually scored, so a
        coverage of 40% means the average describes 40% of the window's threads.
        `topics` lists the categories applied to threads in the window with their
        thread counts.

        Qualitative tone summaries (prose descriptions of tone) are not part of this
        endpoint yet and are absent from the response rather than returned as null.
      operationId: getInboxAnalytics
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive. Range must not exceed 400 days.
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [assignee, contactType]
          description: >-
            Break the same metrics out per assignee, or per the counterpart's contact
            type. Omit for a single total.
        - name: includeJunk
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Aggregated metrics for the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboxAnalytics"
        "400":
          description: Invalid date range or `groupBy` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "403":
          description: The authenticated user cannot reach this inbox.
        "404":
          description: Inbox not found in your company.

  /api/inboxes/{channelId}/trends:
    get:
      summary: Volume and response-time trends for an inbox
      description: |
        A gap-free time series for one inbox, rolled up server-side by day, week,
        month or quarter. Both `dateFrom` and `dateTo` are required (max 400 days);
        `dateTo` is exclusive. Periods with no activity are returned with zero volume
        rather than omitted, so the series can be charted directly.

        All bucketing is UTC. Weeks start Monday (ISO) and are keyed by that Monday's
        date, so week keys sort alongside day keys.

        **Two bucketing bases, deliberately:** `volume` counts messages sent or
        received *during* the period, while `threadCount` and the response/rate
        figures describe threads whose *last activity* fell in the period. Response
        times carry no per-message timestamps, so they can't be attributed to a
        single day of a long-running thread. Do not divide `volume` by `threadCount`.

        Averages are combined from underlying sums and counts, so a quiet day never
        carries the same weight as a busy one. `responseCount` is the number of
        replies behind `avgResponseHrs`.
      operationId: getInboxTrends
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive. Range must not exceed 400 days.
        - name: granularity
          in: query
          schema:
            type: string
            enum: [day, week, month, quarter]
            default: day
        - name: includeJunk
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Gap-free trend series, oldest period first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      granularity:
                        type: string
                        enum: [day, week, month, quarter]
                      window:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InboxTrendPeriod"
        "400":
          description: Missing/invalid window, or invalid granularity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "403":
          description: The authenticated user cannot reach this inbox.
        "404":
          description: Inbox not found in your company.

  /api/inboxes/{channelId}/health:
    get:
      summary: Volume health for an inbox against its own baseline
      description: |
        Compares the requested window's message volume against this inbox's own
        recent norm and scores the deviation, for health/risk surfaces.

        The baseline is a trailing average of the `baselinePeriods` windows of the
        same length immediately before `dateFrom` (default 3). No seasonal
        adjustment is applied. `dateFrom` and `dateTo` are both required; the window
        plus its baseline must stay within a 400-day scan, so long ranges need a
        lower `baselinePeriods`.

        `severityScore` (0–100) tracks the size of a **decline** — growth scores 0
        with label `none`. Bands: `critical` 75+, `high` 50–74, `moderate` 25–49,
        `low` 1–24.

        `trend` compares the two halves of the requested window, which is what
        separates "down and still falling" from "down but recovering".

        **Insufficient history is reported explicitly.** With no baseline volume,
        `volumeVsBaselinePct` and `severityScore` are `null` and `severityLabel` is
        `insufficient_history` — a silent `-100%` would be indistinguishable from a
        real collapse and would drive alerts the data can't justify.
      operationId: getInboxHealth
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive.
        - name: baselinePeriods
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 12
          description: >-
            How many same-length windows before `dateFrom` are averaged into the
            baseline.
        - name: includeJunk
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Volume health for the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboxHealth"
        "400":
          description: >-
            Missing window, invalid `baselinePeriods`, or a window plus baseline
            exceeding the 400-day scan limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "403":
          description: The authenticated user cannot reach this inbox.
        "404":
          description: Inbox not found in your company.

  /api/inboxes/{channelId}/drafts:
    get:
      summary: List unsent drafts on an inbox
      description: |
        Returns the unsent drafts on the given email inbox. The inbox is identified
        by its `channelId` — the same value returned as `channelId` from
        `GET /api/users/{userId}/inboxes`.

        Each item in the response is a draft entry with the parent discussion's
        `streamId` attached. Drafts currently in the process of sending (after
        `POST /api/email/send` was called and before the upstream provider accepts
        the message) are excluded.

        With API-key auth the only scope check is that the inbox belongs to your
        company. With delegate-token auth (`inboxes:*` scope) the inbox must also be
        one the authenticated user can reach personally or via a team membership.
      operationId: listInboxDrafts
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
      responses:
        "200":
          description: List of unsent drafts on the inbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        streamId:
                          type: string
                          description: ID of the discussion the draft belongs to.
                        uuid:
                          type: string
                          description: Draft entry UUID — pass as `uuid` to `POST /api/email/send`.
                        channelId:
                          type: string
                          description: External channel meta ID this draft will be sent from.
                        subject:
                          type: string
                          nullable: true
                        content:
                          type: string
                          nullable: true
                          description: HTML body of the draft (Email type).
                        to:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              label:
                                type: string
                                nullable: true
                        cc:
                          type: array
                          items:
                            type: object
                        bcc:
                          type: array
                          items:
                            type: object
                        attachments:
                          type: array
                          items:
                            type: object
                        ownerId:
                          type: string
                          nullable: true
                        sentBy:
                          type: string
                          nullable: true
                        addedToOutboxAt:
                          type: string
                          format: date-time
                          nullable: true
              example:
                data:
                  - streamId: "stm_abc"
                    uuid: "drf_123"
                    channelId: "acc-1"
                    subject: "Welcome"
                    content: "<p>Hi there</p>"
                    to:
                      - value: "tenant@example.com"
                    cc: []
                    bcc: []
                    attachments: []
                    ownerId: "u_42"
                    sentBy: "u_42"
                    addedToOutboxAt: "2026-05-25T18:14:00.000Z"
        "401":
          description: Invalid or missing API key, or inbox not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inbox not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schema/{boardId}:
    get:
      summary: Get board schema
      description: |
        Returns the list of fields defined on the board. Always fetch the schema first so
        you know which field keys to use when reading or writing card data.
      operationId: getSchema
      tags: [Schema]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID (`aptlet.uuid`).
      responses:
        "200":
          description: Array of field definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaField"
              example:
                - key: "abc123"
                  label: "Tenant Name"
                  type: "text"
                - key: "def456"
                  label: "Move-in Date"
                  type: "date"
                - key: "ghi789"
                  label: "Monthly Rent"
                  type: "money"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API access is disabled for this board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Board not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/boards:
    get:
      summary: List boards
      description: |
        Returns all boards in your company that have API access enabled.
        Each board includes its UUID, display name, and a list of pre-built endpoint URLs
        you can use to interact with cards on that board.

        Accepts an API key (`x-token`) or a delegate token (`Authorization: DelegateToken <token>`).
      operationId: listBoards
      tags: [Boards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      responses:
        "200":
          description: List of API-enabled boards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
              example:
                data:
                  - uuid: "abc-123-board"
                    name: "Leases"
                    endpoints:
                      - method: "GET"
                        url: "https://core-api.getaptly.com/api/board/abc-123-board"
                        description: "Deprecated: use POST /api/board/{boardId}/list"
                      - method: "POST"
                        url: "https://core-api.getaptly.com/api/board/abc-123-board"
                        description: "Create or update a card"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a board
      description: |
        Creates a new board. Requires the key's dedicated "Create Boards" access toggle to be
        enabled, in addition to `insert` permission — unlike the API key's other access
        toggles, this one defaults off and must be explicitly turned on in Setup → Developer.

        A `stage` field is always added automatically (a board can't render a Kanban/pipeline
        view without one) — `ticket` boards default to To Do / In Progress / Done, `deal`
        boards to the standard Aptly deal pipeline. To use your own pipeline instead, pass
        `stages`. You can add, reorder and recolor stages later with `PUT .../configuration/fields/stage`. `stage`, along with a handful of other
        reserved keys (`name`, `dueAt`, `relatedContacts`, and every card-document system key
        such as `_id`, `companyId`, `archived`), can't be used as a custom field's `uuid`.

        Only a safe, self-contained subset of Aptly's field types may be used for custom
        fields — relational types that reference other boards (e.g. `relatedAptlets`,
        `mirror`) and system/computed types the backend manages itself (e.g. `stageselect`,
        `calculation`) are rejected, since a freshly created board has nothing valid for them
        to point at yet.

        The key that creates a board keeps access to it. Even if the key is limited to specific
        boards (so the new board is not on its list), it can read and write the board's cards, see
        it in `GET /api/boards`, and - with the `update` permission but without the "Edit Boards"
        toggle - add, change and remove its fields, change its theme and archive it. This applies
        only to boards created through this endpoint by that key, and ends when the key is deleted.
        It does not extend to other boards, to creating Automations (which has its own toggle), or to
        Tasks, Files and mirror-field links to other boards, which still follow the key's board list.
        Boards created before this change are not affected.
      operationId: createBoard
      tags: [Boards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Board display name.
                boardType:
                  type: string
                  enum: [ticket, deal]
                  default: ticket
                  description: Determines the default `stage` pipeline. Defaults to `ticket`.
                stages:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: |
                    The board's stage pipeline, in order. Replaces the default pipeline for
                    `boardType`. The first stage is where new cards start, so it cannot be
                    closed or won. Labels must be unique. Stage ids are generated for you.
                  items:
                    type: object
                    required: [label]
                    properties:
                      label:
                        type: string
                        maxLength: 100
                        description: Stage display name. Unique on the board.
                      color:
                        type: string
                        example: "#1ec968"
                        description: Hex color. Defaults to a palette color by position.
                      closed:
                        type: boolean
                        default: false
                        description: A closed stage ends a card's life, such as Done or Lost.
                      won:
                        type: boolean
                        default: false
                        description: A closed stage that counts as won. Deal boards only. Implies `closed`.
                fields:
                  type: array
                  description: Optional custom fields to add, beyond the automatic `stage` field.
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                        description: Field display name.
                      type:
                        $ref: "#/components/schemas/NewBoardFieldType"
                      uuid:
                        type: string
                        description: >
                          Optional explicit field key, used later as the key for this field's
                          value in card create/update calls. Must match `^[a-zA-Z][a-zA-Z0-9_]{0,63}$`.
                          Auto-generated when omitted.
                      optional:
                        type: boolean
                        default: true
                      pinned:
                        type: boolean
                        default: false
                        description: Pin this field to the card's Kanban view.
                      defaultValue:
                        type: string
                      data:
                        type: array
                        description: >
                          Required (non-empty) for `singleselect` and `multiselect` — the
                          field's option list. Not used by the other types.
                        items:
                          type: object
                          required: [label]
                          properties:
                            label:
                              type: string
                            uuid:
                              type: string
                              description: Auto-generated when omitted.
            example:
              name: "Maintenance Requests"
              boardType: "ticket"
              stages:
                - label: "Backlog"
                - label: "In Progress"
                  color: "#f1b44c"
                - label: "Done"
                  closed: true
              fields:
                - name: "Priority"
                  type: "singleselect"
                  data:
                    - label: "Low"
                    - label: "Medium"
                    - label: "High"
      responses:
        "201":
          description: Board created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Board"
        "400":
          description: >
            `VALIDATION_ERROR` - missing/invalid `name`, `boardType`, or a `fields` entry
            (per-field `meta.issues`, e.g. `fields.0.type`), or a reserved/duplicate field `uuid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            This API key does not have insert permission, or does not have the dedicated
            "Create Boards" access enabled for this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /api/board/{boardId}/list:
    post:
      summary: List cards
      description: >-
        Returns a paginated list of cards on the board.


        Field values are keyed by field UUID — use the schema endpoint to map keys to labels.

        Money fields are returned as `{ amount, currency }` where `amount` is a decimal.


        All filter params are optional and ANDed together.


        Supply segmentId OR rules (a JSON array), never both. Rules use the existing saved-segment format.
        Invalid rules fail with 400; missing, private-to-another-user, archived, or wrong-board segments return
        404.


        Auth: API key, delegate token (boards:* or boards:{boardId} read scope), or partner bearer token with
        board-admin. Mobile tokens are not accepted. Keys/delegates require API-enabled boards; partner access
        retains its existing API-enabled bypass. API keys/partners may supply userId for an active company
        member; delegates can only use their token user. Without userId only public segments are visible. Public
        means company-shared.


        This /list POST performs no writes and does not change POST /api/board/{boardId}, which creates/updates
        cards. Rules are ANDed. Relative dates are evaluated on each request. See the Board segments guide for
        values, field comparisons, business-hours rules, and examples.
      operationId: listBoardCards
      tags:
        - Cards
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardCardListRequest"
            examples:
              segment:
                summary: Saved segment
                value:
                  page: 0
                  pageSize: 20
                  segmentId: SEGMENT_ID
                  userId: USER_ID
              adhoc:
                summary: My cards in a stage updated within 24 hours
                value:
                  page: 0
                  userId: USER_ID
                  rules:
                    - fieldUuid: assignee
                      operator: anyIn
                      valueSource: currentUser
                    - fieldUuid: stage
                      operator: anyIn
                      value:
                        - In Progress
                    - fieldUuid: updatedAt
                      operator: lastCustomDays
                      value: 1
      responses:
        "200":
          description: Paginated list of cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  count:
                    type: integer
                    description: Total number of matching cards.
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid rules, query parameters, or missing user context.
        "401":
          description: Invalid or missing API key.
        "403":
          description: Read access denied, API disabled, company mismatch, or invalid user selection.
        "404":
          description: Board or accessible active segment not found.

  /api/board/{boardId}:
    delete:
      summary: Archive a board
      description: |
        Archives the board, as the Archive action in the Aptly app does: the board, all of its cards,
        its saved filters and its communication templates are archived, and the cards' open tasks are
        closed out. Nothing is hard-deleted, but there is no API to un-archive, and an archived board
        stops resolving through the API (404). Requires `update` permission and the key's "Edit
        Boards" access.
      operationId: archiveBoard
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                      archived:
                        type: boolean
                      cardsArchived:
                        type: integer
                        description: Cards archived by this call (cards that were already archived aren't counted).
        "401":
          description: Invalid or missing API key.
        "403":
          description: The key lacks `update` permission or "Edit Boards" access, or the board isn't API-enabled.
        "404":
          description: Board not found (or already archived).
    get:
      summary: List cards (deprecated)
      description: >
        Deprecated: use POST /api/board/{boardId}/list. Both endpoints use the same read-only listing
        implementation and response. GET remains supported.


        Returns a paginated list of cards on the board.


        Field values are keyed by field UUID — use the schema endpoint to map keys to labels.

        Money fields are returned as `{ amount, currency }` where `amount` is a decimal.


        All filter params are optional and ANDed together.


        Supply segmentId OR rules (a JSON-encoded array), never both. Rules use the existing saved-segment
        format. Invalid rules fail with 400; missing, private-to-another-user, archived, or wrong-board segments
        return 404.


        Auth: API key, delegate token (boards:* or boards:{boardId} read scope), or partner bearer token with
        board-admin. Mobile tokens are not accepted. Keys/delegates require API-enabled boards; partner access
        retains its existing API-enabled bypass. API keys/partners may supply userId for an active company
        member; delegates can only use their token user. Without userId only public segments are visible. Public
        means company-shared.
      operationId: listCards
      tags:
        - Cards
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9999
          description: Zero-based page number. Legacy GET parses the base-10 integer prefix (1.5 or 1e2 becomes 1).
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
          description: Number of cards per page. Legacy GET parses the base-10 integer prefix; omitted or empty defaults to 20.
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
          description: Only return cards updated after this ISO timestamp.
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
          description: Include archived cards. Legacy GET treats empty or the exact string false as false; any other nonempty string (including 1 or 0) as true. Omitted lets archive rules control selection.
        - name: relatedId
          in: query
          schema:
            type: string
          description: Only return cards where `references.value` contains this ID.
        - name: contactEmail
          in: query
          schema:
            type: string
          description: Resolves the email to contact IDs, then filters cards referencing those contacts.
        - name: keyTerm
          in: query
          schema:
            type: string
          description: Full-text autocomplete search on card title using the Atlas Search index.
        - name: assignee
          in: query
          schema:
            type: string
          description: Filter cards by assignee user ID.
        - name: segmentId
          schema:
            type: string
            maxLength: 256
          description: Existing accessible, active segment on this board; mutually exclusive with rules.
          in: query
        - name: rules
          schema:
            type: string
            maxLength: 64000
          description: JSON-encoded BoardFilterRule array, at most 100 rules. Prefer POST /list with a native JSON array.
          in: query
        - name: userId
          schema:
            type: string
            maxLength: 256
          description: Active company member whose private segments/currentUser values to use. API keys/partners may
            select a member; delegates cannot select another user.
          in: query
      responses:
        "200":
          description: Paginated list of cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  count:
                    type: integer
                    description: Total number of matching cards.
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "400":
          description: Invalid rules, query parameters, or missing user context.
        "401":
          description: Invalid or missing API key.
        "403":
          description: Read access denied, API disabled, company mismatch, or invalid user selection.
        "404":
          description: Board or accessible active segment not found.
      deprecated: true
    post:
      summary: Create or update a card
      description: |
        Creates a new card on the board. Use field UUIDs (from the schema endpoint) as keys in the request body.

        To update an existing card, include its `_id` in the request body. The card must belong to this board.
        Fields not provided in the body are left unchanged on update.

        Contact fields take person ids from the Contacts API: a `person` field takes
        `{ "_id": "<personId>" }` (or `null` to clear it), and a `persons` field takes an
        array of them (`[]` clears it). Each id must be an existing contact in the board's
        company. The stored value is expanded to `{ _id, name, duogram }`, where `name` is
        the contact's full name and `duogram` its initials; any other keys sent are ignored.

        Card-link fields (`location`, `unit`, `relatedAptlets`) always take an array of
        `{ "_id": "<cardId>" }` (`[]` clears the field). Each id must be a live
        (non-archived) card in the board's company that matches every part of the
        field's `filter` that is set: the card must be on one of the boards in
        `filter.aptletUuids`, and its board's type must be in `filter.aptletTypes`.
        `location` and `unit` fields with no `aptletUuids` take cards from the built-in
        `location` and `unit` boards. Values are stored as `{ _id, name, duogram }`.
      operationId: createCard
      tags:
        - Cards
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Existing card ID. When provided, updates that card instead of creating a new one.
                name:
                  type: string
                  description: Card title (also accepted as `title`).
              additionalProperties:
                description: Any board field UUID as key, with the field's value.
            example:
              name: John Smith
              abc123: john@example.com
              ghi789: 1500
              jkl012:
                _id: aBcD1234eFgH5678i
              mno345:
                - _id: kLmN9012oPqR3456s
      responses:
        "200":
          description: Card created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: ID of the created card.
        "400":
          description: A `person`/`persons` or `location`/`unit`/`relatedAptlets` value has the wrong shape, or names a contact or card that does not exist in the board's company or that the field's filter does not allow.
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Board not found.

  /api/board/{boardId}/merge-fields:
    get:
      summary: List merge fields for a board
      description: |
        Returns the merge-field catalog the template editors offer for this board, grouped
        as the Meteor `useMergeFields` hook groups it: `recipient`, `board`, `sender`,
        `showing`, `lease`, `application`, `general`, `company` (the hook's `system` and
        `companyFields` groups are named `general` and `company` here, and its per-board
        `locations`/`aptlets` groups are one flat `board` list, since the path already
        names the board).

        `recipient` is the contact field list plus the company's Person custom fields;
        `board` is the board's mergeable fields plus the image-embed, card-detail,
        contact-table and card-link entries.
      operationId: listBoardMergeFields
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
      responses:
        "200":
          description: The merge-field catalog for this board.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MergeFieldCatalog"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Board not found.


  /api/board/{boardId}/{cardId}:
    get:
      summary: Get a card
      description: Returns a single card by its ID.
      operationId: getCard
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Card"
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Card not found.
    delete:
      summary: Archive a card
      description: |
        Archives the card. This is a soft delete — the card is never removed, only marked
        archived (same as the "Delete" action in the Aptly UI, which archives rather than
        hard-deletes).
      operationId: deleteCard
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      archived:
                        type: boolean
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Card not found.

  /api/board/{boardId}/{cardId}/comments:
    get:
      summary: List comments on a card
      description: Returns all comments on the specified card in chronological order.
      operationId: listComments
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
