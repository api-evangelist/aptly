  /api/board/{boardId}/configuration/filters:
    get:
      summary: List board filters
      description: >-
        Read-only saved segments for this board. Public means company-shared; private means owned by the
        resolved user. Default visibility=all returns public plus that user’s private segments, never other
        users’ private segments. Archived segments and quick views are excluded. Results include the original
        rules and a public/private visibility. Name matching is a case-insensitive literal substring.


        Supports API keys, delegate read tokens, and partner bearer tokens with board-admin; mobile auth is not
        accepted. API keys/partners may provide userId (or x-user-id) for an active member of the board’s
        company. Delegates use their token user and cannot select someone else. Without a userId only public
        segments are returned; visibility=private requires a userId. Keys/delegates require API-enabled boards.
        Partner tokens retain the existing API-enabled bypass.
      operationId: getBoardFilters
      tags:
        - Board
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive literal substring of segment name.
        - name: visibility
          in: query
          schema:
            type: string
            enum:
              - public
              - private
              - all
            default: all
        - name: userId
          schema:
            type: string
            maxLength: 256
          description: Active company member whose private segments/currentUser values to use. API keys/partners may
            select a member; delegates cannot select another user.
          in: query
      responses:
        "200":
          description: List of filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        scope:
                          type: string
                          enum:
                            - company
                            - user
                        aptletUuid:
                          type: string
                        rules:
                          type: array
                          items:
                            $ref: "#/components/schemas/BoardFilterRule"
                        archived:
                          type: boolean
                        visibility:
                          type: string
                          enum:
                            - public
                            - private
        "400":
          description: Invalid rules, query parameters, or missing user context.
        "401":
          description: Invalid or missing API key.
        "403":
          description: Read access denied, API disabled, company mismatch, or invalid user selection.
        "404":
          description: Board not found.

  /api/templates:
    get:
      summary: List templates
      description: |
        Returns communication templates for the company. All filter parameters are optional.

        Accepts an API key (`x-token`), delegate token (`Authorization: DelegateToken <token>`),
        or partner token (`Authorization: Bearer <token>` with `templates` permission).
        When using a partner token, pass `companyId` as a query parameter.
      operationId: listTemplates
      tags: [Templates]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
          description: Company ID. Required when using a partner token; resolved automatically for API key and delegate token auth.
        - name: templateType
          in: query
          schema:
            type: string
            enum: [sms, email, form, eSignature, pdf, blockDocument]
          description: Filter by template type.
        - name: aptletUuid
          in: query
          schema:
            type: string
          description: Filter by associated board UUID.
        - name: archived
          in: query
          schema:
            type: boolean
          description: Filter by archived status.
      responses:
        "200":
          description: Array of templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"
        "400":
          description: Missing companyId.
        "401":
          description: Invalid or missing credential.


    post:
      summary: Create a template
      description: |
        Creates a communication template.

        The acting user — the delegate token's own user, or the body `userId` when
        authenticating with an API key or partner token — must belong to the company and
        hold the `setup` or `setup_communication_templates` permission.

        Only plain templates can be created here — `htmlBuilder` must be `false` or
        omitted.

        `attachmentIds` are resolved against the company's uploaded files, stored on the
        template as full attachment entries, and tied to it so the detached-upload cleanup
        leaves them alone — ids that no longer resolve are dropped. A `pdf` template's
        `subject` becomes a file name, so characters that are illegal in one are stripped.

        ### Merge fields

        `subject` and `content` may contain merge placeholders, which are replaced with
        the recipient's, board card's or company's own values when the template is sent.

        Fetch the available fields from
        `GET /api/board/{boardId}/merge-fields` for the board the template is used with.
        Every item in that response is `{ label, value }` — `label` is what to show a
        human, `value` is what goes inside the braces:

        ```
        {{firstname}}
        {{Locations["Rent"]}}
        {{customFields.7Lq2.LoyaltyTier}}
        ```

        A placeholder may carry a fallback, used when the field is empty or unknown:

        ```
        {{firstname || fallback: there}}        ->  "there" when the contact has no first name
        {{Locations["Rent"] || fallback: TBD}}  ->  "TBD" when the card has no rent
        {{firstname || fallback: }}             ->  renders nothing at all
        ```

        Everything after `fallback:` up to the closing braces is the fallback text, and an
        empty one (or `_blank`) renders nothing.

        Placeholders are **shape**-checked on write — an unclosed `{{`, an empty field
        name, or a malformed bracket reference such as `Locations["Rent]` is rejected with
        400. Whether the field exists is not checked: an unknown field is normal (boards
        differ), and simply renders as its fallback at merge time.
      operationId: createTemplate
      tags: [Templates]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpsert"
            examples:
              email:
                summary: Plain email template
                value:
                  companyId: "{{companyId}}"
                  userId: "{{userId}}"
                  name: "Move-in welcome"
                  description: "Sent to new residents on move-in day"
                  templateType: email
                  subject: "Welcome to your new home"
                  content: "<p>Welcome!</p>"
                  htmlBuilder: false
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Template"
        "400":
          description: Missing companyId, or an invalid payload.
        "401":
          description: Invalid or missing credential.
        "403":
          description: The acting user lacks the template permission.

  /api/templates/{id}:
    get:
      summary: Get a template
      description: Returns a single template by its ID. The template must belong to the authenticated company.
      operationId: getTemplate
      tags: [Templates]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Template ID.
        - name: companyId
          in: query
          schema:
            type: string
          description: Required for partner token auth.
      responses:
        "200":
          description: Template record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Template"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Template not found.

    put:
      summary: Update a template
      description: |
        Replaces the fields of an existing template. The payload and its validation are
        identical to `POST /api/templates` — including the merge-field placeholders
        documented there, whose available `value`s come from
        `GET /api/board/{boardId}/merge-fields`. On top of the template permission, the
        acting user must have access to the library folder the template sits in. A
        template that does not exist — or belongs to another company — returns 404; an
        archived one returns 403, since it is the caller's own and
        `GET /api/templates/{id}` still returns it.
      operationId: editTemplate
      tags: [Templates]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Template ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpsert"
            examples:
              email:
                summary: Plain email template
                value:
                  companyId: "{{companyId}}"
                  userId: "{{userId}}"
                  name: "Move-in welcome"
                  description: "Sent to new residents on move-in day"
                  templateType: email
                  subject: "Welcome to your new home"
                  content: "<p>Welcome!</p>"
                  htmlBuilder: false
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Template"
        "400":
          description: Missing companyId, or an invalid payload.
        "401":
          description: Invalid or missing credential.
        "403":
          description: The acting user lacks the template permission or folder access.
        "404":
          description: Template not found.

  /api/tasks/search:
    post:
      summary: Search tasks
      description: |
        Query tasks for the authenticated company. All body fields are optional filters.
        Date-range filters (`dueAt`, `checkedAt`, `updatedAt`) take an object of
        `{ startDate, endDate }` — either bound may be supplied independently. Set
        `useCount: true` to return `{ count }` instead of `{ tasks }`.
      operationId: searchTasks
      tags: [Tasks]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                  description: Restrict to tasks assigned to these user ids.
                isChecked:
                  type: boolean
                  description: Filter by completion state.
                isPinned:
                  type: boolean
                archived:
                  type: boolean
                  default: false
                taskPriority:
                  type: string
                  description: One of asap|high|medium|low.
                streamId:
                  type: string
                channelId:
                  type: string
                aptletUuid:
                  type: string
                  description: Board UUID.
                aptletInstanceId:
                  type: string
                leaderboard:
                  type: boolean
                onlyAssigned:
                  type: boolean
                unAssigned:
                  type: boolean
                useCount:
                  type: boolean
                  description: Return a count instead of the task list.
                limit:
                  type: integer
                  default: 1000
                dueAt:
                  $ref: "#/components/schemas/TaskDateRange"
                checkedAt:
                  $ref: "#/components/schemas/TaskDateRange"
                updatedAt:
                  $ref: "#/components/schemas/TaskDateRange"
            example:
              isChecked: false
              archived: false
              taskPriority: high
              dueAt:
                startDate: "2026-06-01T00:00:00.000Z"
                endDate: "2026-06-30T00:00:00.000Z"
              limit: 100
      responses:
        "200":
          description: Matching tasks (or a count).
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  count:
                    type: integer
                    description: Present instead of `tasks` when `useCount` is true.
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.

  /api/tasks:
    post:
      summary: Create a task
      description: |
        Creates a task. When `aptletInstanceId` is set, the task is also mirrored as a
        checklist entry on that card.

        The task is attributed to an acting user who must belong to the company. With a
        delegate token the user is taken from the token. With an API key (no associated
        user), supply `userId` in the body — it must belong to the company or the
        request is rejected.
      operationId: createTask
      tags: [Tasks]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, assigneeId, dueAt, type]
              properties:
                userId:
                  type: string
                  description: |
                    Acting user the task is attributed to (createdBy/updatedBy).
                    Required with API-key auth (must belong to the company); ignored
                    with a delegate token, which supplies the user itself.
                title:
                  type: string
                assigneeId:
                  type: string
                  description: User id the task is assigned to.
                dueAt:
                  type: string
                  format: date-time
                type:
                  type: string
                  description: Follow-up type — one of email|comment|sms|voice|card|note|task|logActivity.
                note:
                  type: string
                  description: Task description.
                status:
                  type: string
                  description: One of backlog|notStarted|inProgress|onHold|completed.
                priority:
                  type: string
                  description: One of asap|high|medium|low.
                logType:
                  type: string
                  description: Required when type is "logActivity".
                aptletInstanceId:
                  type: string
                  description: Card id — when set the task is mirrored onto the card checklist.
                aptletUuid:
                  type: string
                channelId:
                  type: string
                streamId:
                  type: string
                fieldId:
                  type: string
                  description: Checklist array field on the card (defaults to "checklist").
                attachmentIds:
                  type: array
                  items:
                    type: string
                references:
                  type: array
                  items:
                    type: object
            example:
              title: Call the tenant
              assigneeId: usr_123
              dueAt: "2026-06-10T00:00:00.000Z"
              type: task
              priority: high
              status: notStarted
      responses:
        "200":
          description: Task created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.

  /api/tasks/{taskId}:
    get:
      summary: Get a task by ID
      description: |
        Fetches a single task with related card/board context and resolved attachment
        metadata. When `includeMetadata=true`, also returns display labels
        (`priorityLabel`, `statusLabel`) and the resolved `assignee`.
      operationId: getTask
      tags: [Tasks]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: includeMetadata
          in: query
          required: false
          schema:
            type: boolean
          description: Include display labels and the resolved assignee.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Task not found.
    put:
      summary: Update a task
      description: |
        Updates a task and keeps its card-checklist mirror entry in sync.

        The update is attributed to a user who must belong to the company. With a
        delegate token the user is taken from the token. With an API key (no
        associated user), supply `userId` in the body — it must belong to the
        company or the request is rejected.
      operationId: updateTask
      tags: [Tasks]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: |
                    Acting user the update is attributed to. Required with API-key
                    auth (must belong to the company); ignored with a delegate
                    token, which supplies the user itself.
                title:
                  type: string
                description:
                  type: string
                checked:
                  type: boolean
                dueAt:
                  type: string
                  format: date-time
                status:
                  type: string
                  description: One of backlog|notStarted|inProgress|onHold|completed.
                priority:
                  type: string
                  description: One of asap|high|medium|low.
                assigneeId:
                  type: string
                archived:
                  type: boolean
                archivedAt:
                  type: string
                  format: date-time
                startedAt:
                  type: string
                  format: date-time
                checkedAt:
                  type: string
                  format: date-time
                pinned:
                  type: boolean
                rank:
                  type: number
                attachmentIds:
                  type: array
                  items:
                    type: string
                outcomeType:
                  type: string
                aptletInstanceId:
                  type: string
                fieldId:
                  type: string
            example:
              title: Renamed task
              checked: true
              status: completed
              priority: high
      responses:
        "200":
          description: Task updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Missing or invalid field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Task not found.

  /api/routing-groups:
    get:
      summary: List routing groups
      description: Returns all active routing groups for the authenticated company.
      operationId: listRoutingGroups
      tags: [RoutingGroups]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      responses:
        "200":
          description: Array of routing groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                      enum: [simultaneous, sequential]
                    destination:
                      type: object
                    ringDurationSeconds:
                      type: number
                    callerExperience:
                      type: object
                    maxWaitSeconds:
                      type: number
                    overflow:
                      type: object
                    archived:
                      type: boolean
        "401":
          description: Invalid or missing credential.

  /api/routing-groups/create:
    post:
      summary: Create a routing group
      description: Creates a new routing group for the authenticated company. Returns the new group's ID.
      operationId: createRoutingGroup
      tags: [RoutingGroups]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  description: Display name for the routing group.
                type:
                  type: string
                  enum: [simultaneous, sequential]
                  description: Ring mode. `simultaneous` rings all members at once; `sequential` tries each in order.
                destination:
                  type: object
                  description: Ring target configuration. Supports `ringType` of `user`, `phone`, `browser`, `agent`, or `multi`.
                ringDurationSeconds:
                  type: number
                  description: How long (in seconds) to ring each target before moving on. Defaults to 20.
                callerExperience:
                  type: object
                  description: Caller-side experience config. Set `mode` to `ring` (default) or `hold-music`.
                maxWaitSeconds:
                  type: number
                  description: Maximum time (in seconds) a caller will wait before overflow handling triggers.
                overflow:
                  type: object
                  description: Overflow/voicemail config. Supports `greetingText` and `voicemailNotification` (array of emails).
            example:
              name: "Support Queue"
              type: "simultaneous"
              destination:
                ringType: "multi"
                ringToList: []
              ringDurationSeconds: 20
              callerExperience:
                mode: "ring"
      responses:
        "200":
          description: Routing group created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: ID of the created routing group.
        "400":
          description: Missing or invalid field (`name` required; `type` must be simultaneous or sequential).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.

  /api/routing-groups/{id}:
    put:
      summary: Update a routing group
      description: |
        Updates an existing routing group. All fields are optional — only provided fields are changed.
        Pass `null` for a field to clear it.
      operationId: updateRoutingGroup
      tags: [RoutingGroups]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The routing group ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [simultaneous, sequential]
                destination:
                  type: object
                  description: Ring target configuration.
                ringDurationSeconds:
                  type: number
                callerExperience:
                  type: object
                maxWaitSeconds:
                  type: number
                overflow:
                  type: object
            example:
              name: "Support Queue"
              ringDurationSeconds: 30
              overflow:
                greetingText: "Please leave a message."
                voicemailNotification: ["support@example.com"]
      responses:
        "200":
          description: Routing group updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid field value (e.g. unrecognized `type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Routing group not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/routing-groups/{id}/archive:
    post:
      summary: Archive a routing group
      description: Soft-deletes a routing group. Archived groups are excluded from list results and cannot be updated.
      operationId: archiveRoutingGroup
      tags: [RoutingGroups]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The routing group ID.
      responses:
        "200":
          description: Routing group archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Invalid or missing credential.
        "404":
          description: Routing group not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/files/upload-url:
    post:
      summary: Get a presigned URL for a direct file upload
      description: |
        First step of the direct file-upload flow. Issues a presigned S3 POST
        policy and records a pending upload.

        **Uploading a file takes three steps:**

        1. **Get a URL** — call this endpoint. It returns `{ fileId, url, fields }`.
        2. **Upload directly to S3** — send a `multipart/form-data` `POST` to
           `url`. Include **every** key/value from `fields` as form fields first,
           then the file itself as the last field named `file`. The upload goes
           straight to S3; it does not pass through this API. A successful upload
           returns HTTP `204` from S3.
        3. **Mark the upload complete** — call
           `POST /api/files/upload-complete` with the `fileId` from step 1. This
           records the file and returns its download URL.

        The presigned policy enforces the content type and a 1 byte–50 MB size
        range. Both `extension` and `contentType` must be on the accepted lists.

        `attachEntityType` is `channel`, `aptlet`, `knowledge`, or `template`, and
        `attachEntityId` is the channel id, aptlet uuid, knowledge doc id, or
        communication template id respectively. The target must exist (scoped to your
        company) or the request is rejected. The file is stored under that entity's
        folder.
      operationId: getFileUploadUrl
      tags: [Files]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, extension, size, contentType, attachEntityType, attachEntityId]
              properties:
                name:
                  type: string
                  description: Original file name.
                  example: invoice.pdf
                extension:
                  type: string
                  description: File extension (lowercase, no dot). Must be an accepted extension.
                  example: pdf
                size:
                  type: integer
                  description: File size in bytes. Must be 1–52428800 (50 MB).
                  example: 20480
                contentType:
                  type: string
                  description: MIME type. Must be an accepted content type.
                  example: application/pdf
                attachEntityType:
                  type: string
                  enum: [channel, aptlet, knowledge, template]
                  description: The kind of entity the file is attached to.
                  example: channel
                attachEntityId:
                  type: string
                  description: >-
                    The channel id (`channel`), aptlet uuid (`aptlet`), knowledge doc id
                    (`knowledge`), or communication template id (`template`) the file
                    belongs to. Must exist within your company.
                  example: 7f3c2a1b9d4e5f6a7b8c9d0e
      responses:
        "200":
          description: Presigned upload policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    description: ID to pass to `/api/files/upload-complete`.
                  url:
                    type: string
                    description: S3 endpoint to POST the multipart form to.
                  fields:
                    type: object
                    additionalProperties:
                      type: string
                    description: Form fields that must be included in the multipart POST (the file part goes last).
        "400":
          description: Invalid or unsupported file, or missing required field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "404":
          description: Target channel, aptlet, or knowledge doc not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/files/upload-complete:
    post:
      summary: Finalize a direct file upload
      description: |
        Final (third) step of the direct file-upload flow. Confirms the file
        was uploaded to S3 and records it. Call this with the `fileId` from
        `/api/files/upload-url` after the `multipart/form-data` POST to the
        presigned `url` succeeded. Returns the file's download URL.
      operationId: completeFileUpload
      tags: [Files]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId:
                  type: string
                  description: The `fileId` returned by `/api/files/upload-url`.
      responses:
        "200":
          description: Upload finalized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    description: ID of the stored file.
                  url:
                    type: string
                    description: Download URL for the stored file.
        "400":
          description: Missing fileId or the upload was already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "404":
          description: No pending upload found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/web-forms/{formId}:
    post:
      summary: Submit a web form
      description: |
        Submits data to an Aptly Web Form. The request must use the API key
        issued for this exact form and that key must have insert access to the
        form's board.

        Submitted board-field values are keyed by field UUID. Depending on the
        form's configuration, the submission creates a card or updates a card
        whose configured match fields have the same values. Unknown properties
        are ignored. Contact shortcut properties can link the card to an
        existing contact or create a new contact when the form and board allow it.
      operationId: submitWebForm
      tags: [WebForms]
      security:
        - ApiKeyHeader: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: string
          description: Web Form ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Card name. Takes precedence over `title`.
                title:
                  type: string
                  description: Card name when `name` is omitted.
                contactFirstName:
                  type: string
                  description: Contact first name used by automatic contact linking.
                contactLastName:
                  type: string
                  description: Contact last name used by automatic contact linking.
                contactFullName:
                  type: string
                  description: Contact full name used by automatic contact linking.
                contactEmail:
                  type: string
                  format: email
                  description: Contact email used for lookup or creation.
                contactPhone:
                  type: string
                  description: Contact phone number used for lookup or creation.
              additionalProperties:
                description: Board field value keyed by the field UUID configured on the form's board.
      responses:
        "200":
          description: Submission accepted and its card created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [_id, action]
                    properties:
                      _id:
                        type: string
                        description: ID of the created or updated card.
                      action:
                        type: string
                        enum: [created, updated]
        "400":
          description: The board API is disabled or the submitted data is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing API key.
        "403":
          description: The API key lacks insert or board access, or was not issued for this form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Form or board not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tours/feedback:
    get:
      summary: List tour feedback
      description: |
        Returns post-tour feedback surveys for the company, newest first.

        A survey is created when a tour showing is approved on a board with tour
        feedback enabled, and the applicant answers it through an emailed link.

        Accepts an API key (`x-token`), delegate token (`Authorization: DelegateToken <token>`
        with the `tours` scope), or partner token (`Authorization: Bearer <token>` with
        `boards` permission). When using a partner token, pass `companyId` as a query parameter.
      operationId: listTourFeedback
      tags: [Tours]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
          description: Company ID. Required when using a partner token; resolved automatically for API key and delegate token auth.
        - name: instanceId
          in: query
          schema:
            type: string
          description: Only surveys for this location/unit card.
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, pending, all]
            default: completed
          description: Whether to return answered surveys, surveys still awaiting an answer, or both.
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Only surveys completed on or after this ISO date.
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: Only surveys completed on or before this ISO date.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size. Values above 200 are clamped.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A page of tour feedback.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TourFeedback"
                  total:
                    type: integer
                    description: Total matching surveys, ignoring limit/offset.
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          description: Missing companyId, or an invalid status, date, limit or offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.

  /api/tours/{showingId}/feedback:
    get:
      summary: Get one showing's tour feedback
      description: |
        Returns the tour feedback survey for a single showing.

        A showing that belongs to another company reads as not found.
      operationId: getTourFeedback
      tags: [Tours]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: showingId
          in: path
          required: true
          schema:
            type: string
          description: Showing (portal application) ID.
        - name: companyId
          in: query
          schema:
            type: string
          description: Company ID. Required when using a partner token; resolved automatically for API key and delegate token auth.
      responses:
        "200":
          description: The tour feedback survey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourFeedback"
        "400":
          description: Missing companyId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or missing credential.
        "404":
          description: No survey found for this showing in this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/docs/openapi:
    get:
      summary: Fetch this OpenAPI spec
      description: |
        Returns the raw contents of this OpenAPI spec (docs/openapi.yaml) as `text/yaml`.
        No authentication required.
      operationId: getPublicOpenApiSpec
      tags: [Docs]
      security: []
      responses:
        "200":
          description: The OpenAPI spec, as YAML.
          content:
            text/yaml:
              schema:
                type: string
