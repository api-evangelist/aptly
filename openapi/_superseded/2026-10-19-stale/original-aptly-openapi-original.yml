openapi: 3.0.3
info:
  title: Aptly API
  version: "1.0"
  description: |
    The Aptly API lets you read and write cards on any Aptly board from external systems.

    All requests require an API key passed as the `x-token` header.
    API keys are scoped to your company and work across all boards.

servers:
  - url: https://core-api.getaptly.com
    description: Production

security:
  - ApiKeyHeader: []

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-token
    DelegateToken:
      type: apiKey
      in: header
      name: Authorization
      description: "Delegate token issued by the platform. Format: `DelegateToken <token>`"
    PartnerBearer:
      type: http
      scheme: bearer
      description: "Partner token. Format: `Authorization: Bearer <token>`"

  schemas:
    Card:
      type: object
      properties:
        cardId:
          type: string
          description: Unique ID of the card.
        boardUuid:
          type: string
          description: UUID of the board this card belongs to.
        archived:
          type: boolean
        assignee:
          type: string
          description: Full name of the assigned user.
      additionalProperties:
        description: Additional properties are dynamic board fields keyed by their field UUID.

    SchemaField:
      type: object
      properties:
        key:
          type: string
          description: Field UUID — use this as the key when reading/writing card data.
        label:
          type: string
          description: Human-readable field name.
        type:
          type: string
          description: Field type (e.g. text, date, money, multiselect, etc.)

    Comment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    TabView:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        url:
          type: string
        icon:
          type: string
        embedSource:
          type: string
        type:
          type: string

    Contact:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the contact.
        uuid:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        fullName:
          type: string
          description: Computed display name (first + last, or company name for org records).
        duogram:
          type: string
          description: Two-letter initials derived from first and last name.
        photoId:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
          description: CDN thumbnail URL for the contact's photo, or null if none.
        email:
          type: string
        phone:
          type: string
        typeId:
          type: string
        companyId:
          type: string
        address:
          type: object
        title:
          type: string
        alerts:
          type: array
          items:
            type: object
        company:
          type: string
          description: Company name — populated when isCompany is true.
        isCompany:
          type: boolean

    KnowledgeDoc:
      type: object
      properties:
        _id:
          type: string
          description: Document ID.
        name:
          type: string
          description: Document title.
        html:
          type: string
          description: Document body rendered as HTML.

    EmailRecipient:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Email address.
        label:
          type: string
          description: Optional display name for the recipient.

    Board:
      type: object
      properties:
        uuid:
          type: string
          description: Board UUID — use this as `boardId` in board/card endpoints.
        name:
          type: string
          description: Display name of the board.
        endpoints:
          type: array
          description: Pre-built endpoint URLs for this board.
          items:
            type: object
            properties:
              method:
                type: string
                description: HTTP method.
              url:
                type: string
                description: Full endpoint URL.
              description:
                type: string
                description: What the endpoint does.

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    TaskDateRange:
      type: object
      description: Date-range filter. Either bound may be supplied independently — `startDate` maps to `$gte`, `endDate` to `$lte`.
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        _id:
          type: string
        companyId:
          type: string
        title:
          type: string
        mergedTitle:
          type: string
          description: Title with `{{ }}` merge tags resolved against the task's representative contact, the company, and the acting user.
        description:
          type: string
        mergedDescription:
          type: string
          description: Description with `{{ }}` merge tags resolved (HTML output).
        userId:
          type: string
          description: Assigned user id.
        checked:
          type: boolean
        archived:
          type: boolean
        status:
          type: string
        priority:
          type: string
        dueAt:
          type: string
          format: date-time
        aptletInstanceId:
          type: string
        aptletUuid:
          type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
              type:
                type: string
        priorityLabel:
          type: string
          description: Present only when includeMetadata=true.
        statusLabel:
          type: string
          description: Present only when includeMetadata=true.
        assignee:
          type: object
          description: Present only when includeMetadata=true.
          properties:
            _id:
              type: string
            fullName:
              type: string
      additionalProperties: true

    Automation:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier for the automation.
        title:
          type: string
          description: Display name of the automation.
        automationType:
          type: string
          enum: [board, schedule]
          description: "`board` automations move/copy cards based on board events; `schedule` automations run on a time-based schedule."
        archived:
          type: boolean
        destinationBoardUuid:
          type: string
          description: UUID of the destination board. Defaults to the current board.
        sourceBoardUuid:
          type: string
          description: (board type only) UUID of the source board.
        runMode:
          type: string
          description: "Board type: `continuously`, `onDate`, `onMonth`, `dateRange`, `onDayOfWeek`. Schedule type: `onDayOfWeek`, `onDate`, `onDayOfYear`."
        segment:
          description: (board type only) Card segment/stage filter.
        moveMode:
          type: string
          enum: [Copy, Move]
          description: (board type only) Whether to copy or move matching cards.
        timeOfDay:
          type: number
          description: (schedule type only) Hour of the day to run (0–23).

    BoardField:
      type: object
      properties:
        uuid:
          type: string
          description: Unique field identifier — use this as the key when reading/writing card data.
        name:
          type: string
          description: Display name of the field.
        type:
          type: string
          description: "Field type. One of: `text`, `string`, `email`, `tel`, `number`, `money`, `date`, `datetime-local`, `boolean`, `singleselect`, `multiselect`, `checkboxlist`, `file`, `files`, `url`, `address`, `person`, `persons`, `relatedAptlets`, `mirror`, `mirror-contact`, `rich-text`, `calculation`, `percent`, `multiplier`, `board`, `heroImage`, `embedVideo`, `ai-computed`."
        position:
          type: integer
          description: Display order (zero-based).
        optional:
          type: boolean
          description: Whether the field is optional on cards.
        archived:
          type: boolean
          description: Whether the field has been archived (hidden from the UI).

    BoardOptions:
      type: object
      description: Configurable board-level settings. All fields are optional — only include the ones you want to change on PATCH.
      properties:
        conversionFlair:
          type: string
          enum: [confetti, fireworks]
        reassignDiscussions:
          type: string
          enum: ["", prompt, auto]
        minCallDuration:
          type: number
          description: Minimum call duration in seconds before the call is logged.
        boardEmailOnlyParsedCards:
          type: boolean
        displayFieldNames:
          type: boolean
        agingIndicator:
          type: boolean
        applicationFeatures:
          type: boolean
        applicationLinking:
          type: boolean
        defaultContactType:
          type: string
        updateBadgeField:
          type: string
          description: Field UUID to use as the card badge label.

    Template:
      type: object
      properties:
        _id:
          type: string
          description: Template ID.
        companyId:
          type: string
          description: Company the template belongs to.
        name:
          type: string
          description: Template display name.
        templateType:
          type: string
          enum: [sms, email, form, eSignature, pdf, blockDocument]
          description: Template category.
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: User ID of the creator, or `"api"` if created via the API.
        updatedAt:
          type: string
          format: date-time
      additionalProperties:
        description: "Additional properties depend on the templateType (e.g. `subject`, `content` for email templates)."

paths:
  /api/users:
    get:
      summary: List users
      description: |
        Returns all non-archived users for the API key's company.
      operationId: listUsers
      tags: [Users]
      security:
        - ApiKeyHeader: []
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: User ID.
                        name:
                          type: string
                          description: Full name (firstname + lastname).
                        role:
                          type: string
                          nullable: true
                          description: Role name, or null if the role has been deleted.
              example:
                data:
                  - _id: "abc123"
                    name: "Alice Smith"
                    role: "Admin"
                  - _id: "def456"
                    name: "Bob Jones"
                    role: "Staff"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{userId}/inboxes:
    get:
      summary: List a user's email inboxes
      description: |
        Returns the email inboxes (Hermes/Nylas channels) accessible to the given user
        within your company. Includes personal inboxes (where the user is a direct member)
        and shared inboxes the user can access via team membership.

        Each inbox is tagged `kind: "personal"` (`isShared` is false and the user is in the
        channel's `userIds`) or `kind: "shared"` (channel marked `isShared`, or accessible
        only through a team membership).

        The user must belong to the company associated with your API key. Returns `401` if
        the user does not belong to your company.
      operationId: listUserInboxes
      tags: [Users]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The user's ID.
      responses:
        "200":
          description: List of inboxes accessible to the user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: Channel document ID.
                        channelId:
                          type: string
                          nullable: true
                          description: External channel meta ID (`meta.id`).
                        type:
                          type: string
                          description: "Channel transport type: `Hermes` or `Nylas`."
                        provider:
                          type: string
                          nullable: true
                          description: "Upstream provider, e.g. `google`, `office365`."
                        email:
                          type: string
                          nullable: true
                          description: Email address of the inbox.
                        name:
                          type: string
                          nullable: true
                          description: Display name of the inbox.
                        kind:
                          type: string
                          enum: [personal, shared]
                          description: Whether the user has personal or shared access.
              example:
                data:
                  - _id: "ch_abc"
                    channelId: "acc-1"
                    type: "Hermes"
                    provider: "google"
                    email: "alice@example.com"
                    name: "Alice's Inbox"
                    kind: "personal"
                  - _id: "ch_def"
                    channelId: "acc-2"
                    type: "Hermes"
                    provider: "google"
                    email: "leasing@example.com"
                    name: "Leasing Team"
                    kind: "shared"
        "401":
          description: Invalid or missing API key, or user does not belong to your company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inboxes/{channelId}/drafts:
    get:
      summary: List unsent drafts on an inbox
      description: |
        Returns the unsent drafts on the given email inbox. The inbox is identified
        by its `channelId` — the same value returned as `channelId` from
        `GET /api/users/{userId}/inboxes`.

        Each item in the response is a draft entry with the parent discussion's
        `streamId` attached. Drafts currently in the process of sending (after
        `POST /api/email/send` was called and before the upstream provider accepts
        the message) are excluded.

        With API-key auth the only scope check is that the inbox belongs to your
        company. With delegate-token auth (`email:*` scope) the inbox must also be
        one the authenticated user can reach personally or via a team membership.
      operationId: listInboxDrafts
      tags: [Inboxes]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
        - PartnerBearer: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: External channel meta ID (`meta.id`) of the inbox.
      responses:
        "200":
          description: List of unsent drafts on the inbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        streamId:
                          type: string
                          description: ID of the discussion the draft belongs to.
                        uuid:
                          type: string
                          description: Draft entry UUID — pass as `uuid` to `POST /api/email/send`.
                        channelId:
                          type: string
                          description: External channel meta ID this draft will be sent from.
                        subject:
                          type: string
                          nullable: true
                        content:
                          type: string
                          nullable: true
                          description: HTML body of the draft (Email type).
                        to:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              label:
                                type: string
                                nullable: true
                        cc:
                          type: array
                          items:
                            type: object
                        bcc:
                          type: array
                          items:
                            type: object
                        attachments:
                          type: array
                          items:
                            type: object
                        ownerId:
                          type: string
                          nullable: true
                        sentBy:
                          type: string
                          nullable: true
                        addedToOutboxAt:
                          type: string
                          format: date-time
                          nullable: true
              example:
                data:
                  - streamId: "stm_abc"
                    uuid: "drf_123"
                    channelId: "acc-1"
                    subject: "Welcome"
                    content: "<p>Hi there</p>"
                    to:
                      - value: "tenant@example.com"
                    cc: []
                    bcc: []
                    attachments: []
                    ownerId: "u_42"
                    sentBy: "u_42"
                    addedToOutboxAt: "2026-05-25T18:14:00.000Z"
        "401":
          description: Invalid or missing API key, or inbox not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inbox not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schema/{boardId}:
    get:
      summary: Get board schema
      description: |
        Returns the list of fields defined on the board. Always fetch the schema first so
        you know which field keys to use when reading or writing card data.
      operationId: getSchema
      tags: [Schema]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID (`aptlet.uuid`).
      responses:
        "200":
          description: Array of field definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaField"
              example:
                - key: "abc123"
                  label: "Tenant Name"
                  type: "text"
                - key: "def456"
                  label: "Move-in Date"
                  type: "date"
                - key: "ghi789"
                  label: "Monthly Rent"
                  type: "money"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: API access is disabled for this board.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Board not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/boards:
    get:
      summary: List boards
      description: |
        Returns all boards in your company that have API access enabled.
        Each board includes its UUID, display name, and a list of pre-built endpoint URLs
        you can use to interact with cards on that board.

        Accepts an API key (`x-token`) or a delegate token (`Authorization: DelegateToken <token>`).
      operationId: listBoards
      tags: [Boards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      responses:
        "200":
          description: List of API-enabled boards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
              example:
                data:
                  - uuid: "abc-123-board"
                    name: "Leases"
                    endpoints:
                      - method: "GET"
                        url: "https://core-api.getaptly.com/api/board/abc-123-board"
                        description: "List cards (query: page, pageSize, updatedAtMin, includeArchived)"
                      - method: "POST"
                        url: "https://core-api.getaptly.com/api/board/abc-123-board"
                        description: "Create or update a card"
        "401":
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /api/board/{boardId}:
    get:
      summary: List cards
      description: |
        Returns a paginated list of cards on the board.

        Field values are keyed by field UUID — use the schema endpoint to map keys to labels.
        Money fields are returned as `{ amount, currency }` where `amount` is a decimal.

        All filter params are optional and ANDed together.
      operationId: listCards
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
          description: The board's UUID.
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9999
          description: Zero-based page number.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
          description: Number of cards per page.
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
          description: Only return cards updated after this ISO timestamp.
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
          description: Include archived cards.
        - name: relatedId
          in: query
          schema:
            type: string
          description: Only return cards where `references.value` contains this ID.
        - name: contactEmail
          in: query
          schema:
            type: string
          description: Resolves the email to contact IDs, then filters cards referencing those contacts.
        - name: keyTerm
          in: query
          schema:
            type: string
          description: Full-text autocomplete search on card title using the Atlas Search index.
        - name: assignee
          in: query
          schema:
            type: string
          description: Filter cards by assignee user ID.
      responses:
        "200":
          description: Paginated list of cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  count:
                    type: integer
                    description: Total number of matching cards.
                  page:
                    type: integer
                  pageSize:
                    type: integer
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Board not found.

    post:
      summary: Create or update a card
      description: |
        Creates a new card on the board. Use field UUIDs (from the schema endpoint) as keys in the request body.

        To update an existing card, include its `_id` in the request body. The card must belong to this board.
        Fields not provided in the body are left unchanged on update.
      operationId: createCard
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Existing card ID. When provided, updates that card instead of creating a new one.
                name:
                  type: string
                  description: Card title (also accepted as `title`).
              additionalProperties:
                description: Any board field UUID as key, with the field's value.
            example:
              name: "John Smith"
              abc123: "john@example.com"
              ghi789: 1500
      responses:
        "200":
          description: Card created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: ID of the created card.
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Board not found.

  /api/board/{boardId}/{cardId}:
    get:
      summary: Get a card
      description: Returns a single card by its ID.
      operationId: getCard
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Card data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Card"
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Card not found.

  /api/board/{boardId}/{cardId}/comments:
    get:
      summary: List comments on a card
      description: Returns all comments on the specified card in chronological order.
      operationId: listComments
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
              example:
                data:
                  - id: "lk3jf8"
                    userId: "user_abc"
                    content: "Application approved."
                    createdAt: "2026-01-15T10:30:00Z"
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Board or card not found.

  /api/board/{boardId}/{cardId}/contacts:
    get:
      summary: List contacts linked to a card
      description: |
        Returns all person contacts linked to the card via its person/persons fields.
        Returns an empty array if the board has no person fields or none are populated.
      operationId: listCardContacts
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of linked contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        "401":
          description: Invalid or missing API key.
        "403":
          description: API access is disabled for this board.
        "404":
          description: Board or card not found.

  /api/board/{boardId}/{cardId}/comment:
    post:
      summary: Add or update a comment
      description: |
        Adds a new comment to a card. To update an existing comment, include its `id` in the body —
        the `userId` must match the original comment's author.
      operationId: postComment
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, content]
              properties:
                userId:
                  type: string
                  description: Aptly user ID of the comment author.
                content:
                  type: string
                  description: Comment text.
                id:
                  type: string
                  description: Existing comment ID — include to update rather than create.
      responses:
        "200":
          description: Comment created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Comment"
        "401":
          description: Invalid or missing API key.
        "404":
          description: Card or comment not found.

  /api/board/{boardId}/{cardId}/file:
    post:
      summary: Upload a file to a card
      description: |
        Uploads a file and attaches it to a card. Send as `multipart/form-data` with the file in the `file` field.

        **Max file size:** 50 MB

        **Accepted types:** JPEG, PNG, GIF, WebP, SVG, PDF, Word, Excel, plain text, CSV, MP4, MOV, MP3, WAV
      operationId: uploadFile
      tags: [Cards]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded and attached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fileId:
                        type: string
                      name:
                        type: string
                      size:
                        type: integer
                      type:
                        type: string
        "400":
          description: Missing file or unsupported file type.
        "401":
          description: Invalid or missing API key.
        "404":
          description: Card not found.

  /api/board/{boardId}/configuration/tabViews:
    post:
      summary: Add a tab view
      description: Adds an embedded tab view to the board's tab list.
      operationId: postTabView
      tags: [Board]
      security:
        - ApiKeyHeader: []
        - DelegateToken: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
