openapi: 3.2.0
info:
  title: Aptly Contacts API
  version: '1.1'
  description: 'The Aptly API lets external systems work with boards, contacts, inboxes,

    tasks, files, and other Aptly resources.


    Most endpoints accept an API key in the `x-token` header. Some endpoints

    also accept a delegate token or partner bearer token, as shown in each

    operation''s security requirements, and explicitly public endpoints require

    no credential. API keys are scoped to a company and may be restricted to

    specific boards and read, insert, or update permissions; requests outside

    those restrictions receive a 403 `FORBIDDEN` response.'
servers:
- url: https://core-api.getaptly.com
  description: Production
security:
- ApiKeyHeader: []
tags:
- name: Contacts
paths:
  /api/contacts/conversations:
    post:
      description: Find real email, SMS, and call conversations by the contacts’ stored email addresses and phone numbers, without a helpdesk ticket requirement. Includes open and closed threads by default, with no recent-date cutoff. Excludes junk/deleted streams and synthetic bulk-campaign activity. Newest message first, across accessible inboxes. API keys have company scope; delegate tokens need contacts:* read scope and follow current membership, inbox/team/monitor and contact-type sharing permissions (respecting channel opt-outs). Every contact must be active and in the authenticated company. Empty addresses return an empty page.
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      responses:
        '200':
          description: A page of matching conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConversationsResponse'
        '400':
          description: Invalid contact IDs, filters or pagination.
        '401':
          description: Invalid or missing credentials.
        '403':
          description: Missing scope, inactive user membership, guest user, or inaccessible inbox.
        '404':
          description: One or more contacts are missing, archived, deleted or outside the company.
      summary: Get conversations for contacts
      operationId: getConversationsForContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - personIds
              properties:
                personIds:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                status:
                  type: string
                  enum:
                  - all
                  - open
                  - closed
                  default: all
                inboxId:
                  type: string
                  description: Channel meta.id; narrows authorized inboxes, never expands access.
                search:
                  type: string
                  maxLength: 200
                  description: Subject contains text; comma-separated literal alternatives.
                skip:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
                limit:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 20
            example:
              personIds:
              - contact-1
              - contact-2
              status: all
              skip: 0
              limit: 20
  /api/contacts/{contactId}/conversations:
    get:
      description: Find real email, SMS, and call conversations by the contacts’ stored email addresses and phone numbers, without a helpdesk ticket requirement. Includes open and closed threads by default, with no recent-date cutoff. Excludes junk/deleted streams and synthetic bulk-campaign activity. Newest message first, across accessible inboxes. API keys have company scope; delegate tokens need contacts:* read scope and follow current membership, inbox/team/monitor and contact-type sharing permissions (respecting channel opt-outs). Every contact must be active and in the authenticated company. Empty addresses return an empty page.
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      responses:
        '200':
          description: A page of matching conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConversationsResponse'
        '400':
          description: Invalid contact IDs, filters or pagination.
        '401':
          description: Invalid or missing credentials.
        '403':
          description: Missing scope, inactive user membership, guest user, or inaccessible inbox.
        '404':
          description: One or more contacts are missing, archived, deleted or outside the company.
      summary: Get contact conversations
      operationId: getContactConversations
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - open
          - closed
          default: all
      - name: inboxId
        in: query
        schema:
          type: string
          description: Channel meta.id; narrows authorized inboxes, never expands access.
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
          description: Subject contains text; comma-separated literal alternatives.
      - name: skip
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 60
          default: 20
  /api/contacts:
    get:
      summary: List contacts
      description: Returns a paginated list of contacts scoped to your company. All filter params are optional and ANDed together.
      operationId: listContacts
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
        description: Zero-based page index.
      - name: contact_type
        in: query
        schema:
          type: string
        description: Filter by contact type name.
      - name: email
        in: query
        schema:
          type: string
        description: Filter by exact email address (case-insensitive).
      - name: phone
        in: query
        schema:
          type: string
        description: Filter by phone number (digits only, partial match).
      - name: name
        in: query
        schema:
          type: string
        description: Filter by full name (case-insensitive, all words must match).
      - name: updated_after
        in: query
        schema:
          type: string
          format: date-time
        description: Return only contacts updated after this ISO 8601 timestamp.
      - name: updated_before
        in: query
        schema:
          type: string
          format: date-time
        description: Return only contacts updated before this ISO 8601 timestamp.
      responses:
        '200':
          description: Paginated contact list.
          headers:
            x-offset:
              schema:
                type: integer
              description: Current page index.
            x-count:
              schema:
                type: integer
              description: Total matching contacts.
            x-size:
              schema:
                type: integer
              description: Page size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '400':
          description: Missing or invalid parameters.
        '401':
          description: Invalid or missing API key.
    post:
      summary: Create or update a contact
      description: 'Creates a new contact or updates an existing one (upsert).


        **Lookup order:**

        1. If `_id` is provided, finds by ID.

        2. Otherwise finds by first email address.

        3. If no match is found, creates a new contact.


        **Body formats** — either native or legacy (capitalized keys) are accepted:


        *Native:* `firstname`, `lastname`, `email` (string or array), `phone` (array of `{number, type}`),

        `typeId`, `contactType`, `isCompany`, `title`, `company`, `imageUrl`, `customFields`


        *Legacy:* `"First Name"`, `"Last Name"`, `Email`, `"Mobile Phone"`, `"Work Phone"`,

        `"Home Phone"`, `"Contact Type"`, `Title`, `Company`


        Returns the enriched contact with custom fields populated by their type definitions.'
      operationId: upsertContact
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Existing contact ID — when provided, updates that contact.
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  description: One or more email addresses.
                phone:
                  type: array
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                      type:
                        type: string
                        enum:
                        - mobile
                        - work
                        - home
                typeId:
                  type: string
                  description: Contact type ID.
                contactType:
                  type: string
                  description: Contact type name (alternative to `typeId` — resolved to an ID automatically).
                isCompany:
                  type: boolean
                title:
                  type: string
                company:
                  type: string
                imageUrl:
                  type: string
                  description: Absolute URL to a JPG or PNG photo.
                customFields:
                  type: object
                  description: Map of custom field ID to value. Unknown field IDs are rejected.
            example:
              firstname: Jane
              lastname: Smith
              email: jane@example.com
              phone:
              - number: '+15555550100'
                type: mobile
              contactType: Tenant
      responses:
        '200':
          description: Contact created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid input (bad URL, unknown custom field, invalid date, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing API key.
  /api/contacts/by-email:
    post:
      summary: Look up contacts by email
      description: 'Returns contacts whose email address matches one or more of the provided values.

        Matching is case-insensitive and exact. Results are scoped to your company.'
      operationId: getContactsByEmail
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  description: A single email address or an array of email addresses to look up.
                limit:
                  type: integer
                  default: 20
                  description: Maximum number of results to return.
                skip:
                  type: integer
                  default: 0
                  description: Number of results to skip (for pagination).
            example:
              email: jane@example.com
              limit: 20
              skip: 0
      responses:
        '200':
          description: Matching contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '400':
          description: Missing or invalid email field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing API key.
  /api/contacts/verify-email:
    post:
      summary: Initiate contact email verification
      description: 'Looks up an email address against your org''s contact database. If a match is found,

        generates a cryptographically strong 6-digit code, sends it to the address, and

        returns a `requestId` and `verifyUrl` to complete the verification.


        The code expires after 10 minutes and can only be used once.'
      operationId: initiateContactVerification
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: The email address to verify.
                emailSubject:
                  type: string
                  description: Subject line for the verification email. Defaults to "Your verification code".
                replyTo:
                  type: string
                  description: Reply-To address for the verification email.
                emailHtml:
                  type: string
                  description: 'Custom HTML body for the verification email. Supports two placeholders:

                    `{{ verificationCode }}` — replaced with the 6-digit code.

                    `{{ expirationTime }}` — replaced with the expiry duration (e.g. "10 minutes").

                    '
            example:
              email: jane@example.com
              emailSubject: Your access code
              replyTo: support@example.com
              emailHtml: <p>Your code is <strong>{{ verificationCode }}</strong>. It expires in {{ expirationTime }}.</p>
      responses:
        '200':
          description: Verification initiated — code sent to the email address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    description: Opaque ID used to complete the verification.
                  verifyUrl:
                    type: string
                    description: API path to POST the code to (relative URL).
              example:
                requestId: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                verifyUrl: /api/contacts/verify-email/a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4/confirm
        '400':
          description: Missing or invalid email field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No contact found with that email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Verification request was created but the email could not be delivered (EMAIL_SEND_FAILURE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/contacts/verify-email/{requestId}/confirm:
    post:
      summary: Confirm contact email verification
      description: 'Submits the 6-digit code received by email. Returns the matching contact records

        if the code is valid, not expired, and has not already been used.


        After 5 consecutive failed attempts the verification is permanently invalidated.

        The caller must re-initiate a new verification to try again.'
      operationId: confirmContactVerification
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        description: The `requestId` returned by the initiate endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: The 6-digit verification code sent to the email address.
            example:
              code: 042815
      responses:
        '200':
          description: Code accepted — returns verified status and matching contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '400':
          description: Missing code field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing API key, or code is invalid/expired/already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/contacts/{contactId}:
    get:
      summary: Get a contact
      description: Returns a single contact by its ID, with custom fields enriched by their type definitions.
      operationId: getContact
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
        description: The contact's `_id`.
      responses:
        '200':
          description: Contact record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  count:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '401':
          description: Invalid or missing API key.
    post:
      summary: Update a contact
      description: 'Updates an existing contact by ID using the same upsert logic as `POST /api/contacts`.

        The `_id` is taken from the URL — any `_id` in the body is ignored.


        Accepts the same **native** or **legacy** body formats as `POST /api/contacts`.

        Returns the updated, enriched contact.'
      operationId: updateContact
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
        description: The contact's `_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  description: One or more email addresses.
                phone:
                  type: array
                  items:
                    type: object
                    properties:
                      number:
                        type: string
                      type:
                        type: string
                        enum:
                        - mobile
                        - work
                        - home
                typeId:
                  type: string
                  description: Contact type ID.
                contactType:
                  type: string
                  description: Contact type name (alternative to `typeId`).
                isCompany:
                  type: boolean
                title:
                  type: string
                company:
                  type: string
                imageUrl:
                  type: string
                  description: Absolute URL to a JPG or PNG photo.
                customFields:
                  type: object
                  description: Map of custom field ID to value.
            example:
              firstname: Jane
              lastname: Smith
              email: jane@example.com
      responses:
        '200':
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing API key.
  /api/contacts/{contactId}/sentiment:
    get:
      summary: Get a contact's sentiment history
      description: 'Returns the contact''s conversation sentiment over the last 30 days, merged into a

        single series across every channel in the company and keyed off the addresses in the

        contact''s `email` array.


        One point per day, oldest first. `score` is the average of the day''s streams — each

        stream contributes one score, so a long conversation does not outweigh a short one —

        rounded to a whole number on a 0-100 scale. `overall` is the recency-weighted average

        across the window: today counts fully, a day at the edge of the window counts half.

        `totalStreams` counts the distinct conversations in the window, so a conversation

        spanning several days is counted once.


        A contact with no email addresses, or with no scored conversations in the window,

        returns `overall: null` and an empty `history`.'
      operationId: getContactSentiment
      tags:
      - Contacts
      security:
      - ApiKeyHeader: []
      - DelegateToken: []
      parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
        description: The contact's `_id`.
      responses:
        '200':
          description: Sentiment history for the contact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall:
                    type:
                    - integer
                    - 'null'
                    description: Recency-weighted average score (0-100) across the window.
                  totalStreams:
                    type: integer
                    description: Distinct conversations behind the window.
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date-time
                        score:
                          type: integer
                          description: Average score (0-100) for the day.
                        streams:
                          type: integer
                          description: Distinct conversations behind the day.
              example:
                overall: 76
                totalStreams: 2
                history:
                - date: '2026-08-15T00:00:00.000Z'
                  score: 40
                  streams: 2
                - date: '2026-09-04T00:00:00.000Z'
                  score: 100
                  streams: 1
        '401':
          description: Invalid or missing API key.
        '404':
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ContactConversationsResponse:
      type: object
      required:
      - personIds
      - conversations
      - hasMore
      - skip
      - limit
      properties:
        personIds:
          type: array
          items:
            type: string
        conversations:
          type: array
          items:
            type: object
            required:
            - _id
            - subject
            - description
            - messageCount
            properties:
              _id:
                type: string
                description: Conversation stream ID.
              subject:
                type:
                - string
                - 'null'
              description:
                type: string
                maxLength: 500
              type:
                type: string
              status:
                type: integer
                description: 0 closed, 1 open, 2 waiting, 3 replied.
              assigneeId:
                type:
                - string
                - 'null'
              participants:
                type: array
                items:
                  type: string
              channel:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
              messageCount:
                type: integer
              metrics:
                type: object
                properties:
                  lastMessageAt:
                    type: string
                    format: date-time
                  lastActivityAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  lastMessageDirection:
                    type:
                    - string
                    - 'null'
                    enum:
                    - in
                    - out
        hasMore:
          type: boolean
          description: When true, request the next page with skip + limit.
        skip:
          type: integer
        limit:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Contact:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the contact.
        uuid:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        fullName:
          type: string
          description: Computed display name (first + last, or company name for org records).
        duogram:
          type: string
          description: Two-letter initials derived from first and last name.
        photoId:
          type:
          - string
          - 'null'
        imageUrl:
          type:
          - string
          - 'null'
          description: CDN thumbnail URL for the contact's photo, or null if none.
        email:
          type: string
        phone:
          type: string
        typeId:
          type: string
        companyId:
          type: string
        address:
          type: object
        title:
          type: string
        alerts:
          type: array
          items:
            type: object
        company:
          type: string
          description: Company name — populated when isCompany is true.
        isCompany:
          type: boolean
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-token
    DelegateToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Delegate token issued by the platform. Format: `DelegateToken <token>`'
    PartnerBearer:
      type: http
      scheme: bearer
      description: 'Partner token. Format: `Authorization: Bearer <token>`'
